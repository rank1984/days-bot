name: Market Monitor

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'   # 09:00-17:00 ET (13-21 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: days-bot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore DB from repo
        run: git checkout -- data/*.db || true
      - name: Run Trigger Monitor
        run: python trigger_monitor.py
      - name: Run Entry (if any READY)
        run: python main.py entry
      - name: Run Trade Monitor
        run: python trade_monitor.py
      - name: Commit and push DB
        run: |
          git config user.name "DAYS-BOT"
          git config user.email "days-bot@users.noreply.github.com"
          git add data/*.db
          git diff --cached --quiet || git commit -m "chore: update trades $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
