name: DAYS-BOT V5.0.6 Evaluator

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Artifact name (empty = auto-detect latest for scan_date)'
        required: false
        default: ''

      artifact_run_id:
        description: 'Run ID (empty = auto)'
        required: false
        default: ''

      scan_date:
        description: 'Scan date YYYY-MM-DD (empty = auto)'
        required: false
        default: ''

  # ============================================================
  # EOD EVALUATOR
  #
  # Fixed New York timezone.
  # GitHub handles EDT / EST automatically.
  #
  # 17:15 ET = 00:15 Israel during IDT
  # 17:15 ET = 00:15 Israel during IST
  #
  # Market closes at 16:00 ET.
  # Evaluator starts 75 minutes later.
  # ============================================================
  schedule:
    - cron: '15 17 * * 1-5'
      timezone: "America/New_York"

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Determine mode
      # ============================================================
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ inputs.artifact_run_id }}" ]; then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi

          echo "Evaluation mode determined."

      # ============================================================
      # Python
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # Prepare directories
      # ============================================================
      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p /tmp/artifact
          mkdir -p /tmp/eod

      # ============================================================
      # Resolve target scan date + artifact
      # ============================================================
      - name: Resolve target scan_date
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "V5.0.6 EVALUATOR TARGET RESOLUTION"
          echo "=================================================="

          if [ "${{ steps.mode.outputs.mode }}" = "manual" ]; then

            TARGET_DATE="${{ inputs.scan_date }}"
            ARTIFACT_NAME="${{ inputs.artifact_name }}"
            RUN_ID="${{ inputs.artifact_run_id }}"

            if [ -z "$TARGET_DATE" ]; then
              echo "ERROR: manual mode requires scan_date"
              exit 1
            fi

            if [ -z "$RUN_ID" ]; then
              echo "ERROR: manual mode requires artifact_run_id"
              exit 1
            fi

            if [ -z "$ARTIFACT_NAME" ]; then
              echo "ERROR: manual mode requires artifact_name"
              exit 1
            fi

            echo "[evaluate] Manual target:"
            echo "  scan_date=$TARGET_DATE"
            echo "  artifact=$ARTIFACT_NAME"
            echo "  run_id=$RUN_ID"

          else

            NOW_ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
            NOW_HOUR_RAW=$(TZ=America/New_York date +%H)
            NOW_HOUR=$((10#$NOW_HOUR_RAW))

            TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)

            if [ "$NOW_HOUR" -lt 16 ]; then
              TARGET_DATE=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d)

              echo "[evaluate] Before 16:00 ET."
              echo "[evaluate] Targeting previous calendar day: $TARGET_DATE"
            else
              TARGET_DATE="$TODAY_ET"
            fi

            echo "[evaluate] Current ET time: $NOW_ET"
            echo "[evaluate] Target scan_date: $TARGET_DATE"

            FOUND=$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                --jq "
                  [
                    .artifacts[]
                    | select(.expired == false)
                    | select(.name | startswith(\"scan-${TARGET_DATE}-r\"))
                  ]
                  | sort_by(.created_at)
                  | reverse
                  | .[0] // empty
                "
            )

            if [ -z "$FOUND" ]; then
              echo "[evaluate] No non-expired scan artifact found for $TARGET_DATE"

              echo "has_target=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ARTIFACT_NAME=$(echo "$FOUND" | jq -r '.name')
            RUN_ID=$(echo "$FOUND" | jq -r '.workflow_run.id')

            echo "[evaluate] Latest artifact:"
            echo "  scan_date=$TARGET_DATE"
            echo "  artifact=$ARTIFACT_NAME"
            echo "  run_id=$RUN_ID"

          fi

          if [ -z "$TARGET_DATE" ] || \
             [ -z "$ARTIFACT_NAME" ] || \
             [ -z "$RUN_ID" ]; then

            echo "[evaluate] ERROR: incomplete evaluation target"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "scan_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "has_target=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # No target
      # ============================================================
      - name: Exit early if no target
        if: steps.target.outputs.has_target != 'true'
        run: |
          echo "=================================================="
          echo "NO EVALUATION TARGET"
          echo "=================================================="
          echo "No scan artifact exists for the requested date."
          echo "No fabricated evaluation will be performed."
          echo "Workflow ends without evaluating anything."

      # ============================================================
      # Download target artifact
      # ============================================================
      - name: Download target artifact
        if: steps.target.outputs.has_target == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          run-id: ${{ steps.target.outputs.run_id }}
          path: /tmp/artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Locate DB
      # ============================================================
      - name: Locate alerts.db
        if: steps.target.outputs.has_target == 'true'
        run: |
          set -euo pipefail

          echo "=== Artifact contents ==="
          find /tmp/artifact -type f -print

          DB=$(find /tmp/artifact -name "alerts.db" -type f | head -1)

          if [ -z "$DB" ]; then
            echo "ERROR: alerts.db not found in target artifact"
            exit 1
          fi

          cp "$DB" data/alerts.db

          echo "Target DB:"
          ls -lh data/alerts.db

      # ============================================================
      # Verify DB belongs to target scan date
      # ============================================================
      - name: Verify target DB
        if: steps.target.outputs.has_target == 'true'
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import sys

          expected = "${{ steps.target.outputs.scan_date }}"

          conn = sqlite3.connect("data/alerts.db")
          cur = conn.cursor()

          print("=" * 74)
          print("TARGET DB VERIFICATION")
          print("=" * 74)
          print(f"Expected scan_date: {expected}")

          try:
              alert_dates = cur.execute(
                  """
                  SELECT DISTINCT scan_date
                  FROM alerts
                  ORDER BY scan_date DESC
                  """
              ).fetchall()
          except Exception:
              alert_dates = []

          print("alerts.scan_date values:")
          for row in alert_dates[:10]:
              print(f"  {row[0]}")

          try:
              snapshot_dates = cur.execute(
                  """
                  SELECT DISTINCT scan_date
                  FROM snapshots
                  ORDER BY scan_date DESC
                  """
              ).fetchall()
          except Exception as exc:
              print(f"ERROR: snapshots table unavailable: {exc}")
              conn.close()
              sys.exit(1)

          print("snapshots.scan_date values:")
          for row in snapshot_dates[:10]:
              print(f"  {row[0]}")

          target_count = cur.execute(
              """
              SELECT COUNT(*)
              FROM snapshots
              WHERE scan_date = ?
              """,
              (expected,)
          ).fetchone()[0]

          print(f"Snapshots for target date: {target_count}")

          if target_count == 0:
              print()
              print("ERROR: target date has zero snapshots.")
              print("Evaluator will NOT run.")
              conn.close()
              sys.exit(1)

          conn.close()

          print()
          print("PASS: Target DB contains snapshots for requested scan_date.")
          PYEOF

      # ============================================================
      # Verify RTH completion window
      # ============================================================
      - name: Verify RTH completion window
        if: steps.target.outputs.has_target == 'true'
        run: |
          python3 << 'PYEOF'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import sys

          ET = ZoneInfo("America/New_York")

          now = datetime.now(ET)

          target_date = "${{ steps.target.outputs.scan_date }}"

          target_day = datetime.strptime(
              target_date,
              "%Y-%m-%d"
          ).date()

          today = now.date()

          print("=" * 74)
          print("RTH COMPLETENESS CHECK")
          print("=" * 74)
          print(f"Current ET: {now}")
          print(f"Target date: {target_date}")
          print(f"Today ET: {today}")

          if target_day < today:
              print("PASS: target is a previous trading/calendar day.")
              sys.exit(0)

          if target_day == today:
              if now.hour < 16:
                  print("ERROR: RTH is not complete yet.")
                  print("Evaluator must not run before 16:00 ET.")
                  sys.exit(1)

              print("PASS: current ET time is after 16:00.")
              sys.exit(0)

          print("ERROR: target date is in the future.")
          sys.exit(1)
          PYEOF

      # ============================================================
      # Run evaluator
      # ============================================================
      - name: Run evaluator
        if: steps.target.outputs.has_target == 'true'
        run: |
          set -euo pipefail

          echo "==================================================="
          echo "V5.0.6 EVALUATOR"
          echo "scan_date=${{ steps.target.outputs.scan_date }}"
          echo "artifact=${{ steps.target.outputs.artifact_name }}"
          echo "run_id=${{ steps.target.outputs.run_id }}"
          echo "==================================================="

          python evaluate_snapshots.py \
            --scan-date "${{ steps.target.outputs.scan_date }}"

      # ============================================================
      # Verify evaluator produced evidence
      # ============================================================
      - name: Verify evaluation evidence
        if: steps.target.outputs.has_target == 'true'
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import sys

          conn = sqlite3.connect("data/alerts.db")
          cur = conn.cursor()

          target = "${{ steps.target.outputs.scan_date }}"

          print("=" * 74)
          print("POST-EVALUATION EVIDENCE CHECK")
          print("=" * 74)

          snapshot_count = cur.execute(
              """
              SELECT COUNT(*)
              FROM snapshots
              WHERE scan_date = ?
              """,
              (target,)
          ).fetchone()[0]

          trigger_count = cur.execute(
              """
              SELECT COUNT(*)
              FROM trigger_results tr
              JOIN snapshots s
                ON s.snapshot_id = tr.snapshot_id
              WHERE s.scan_date = ?
              """,
              (target,)
          ).fetchone()[0]

          outcome_count = cur.execute(
              """
              SELECT COUNT(*)
              FROM outcomes o
              JOIN snapshots s
                ON s.snapshot_id = o.snapshot_id
              WHERE s.scan_date = ?
              """,
              (target,)
          ).fetchone()[0]

          print(f"Snapshots:       {snapshot_count}")
          print(f"Trigger results: {trigger_count}")
          print(f"Outcomes:        {outcome_count}")

          if snapshot_count == 0:
              print("ERROR: zero snapshots after evaluation")
              conn.close()
              sys.exit(1)

          conn.close()

          print()
          print("PASS: Evaluation evidence database is readable.")
          PYEOF

      # ============================================================
      # Generate EOD report
      # ============================================================
      - name: Generate EOD report
        if: steps.target.outputs.has_target == 'true'
        run: |
          set -euo pipefail

          python eod_report/generate_eod_report.py \
            --scan-date "${{ steps.target.outputs.scan_date }}" \
            --output "/tmp/eod/eod_report.md"

          if [ ! -f "/tmp/eod/eod_report.md" ]; then
            echo "ERROR: EOD report was not created"
            exit 1
          fi

          echo "=================================================="
          echo "EOD REPORT"
          echo "=================================================="

          cat /tmp/eod/eod_report.md

      # ============================================================
      # Send EOD report to Telegram
      #
      # Telegram limit: 4096 characters/message.
      # We send plain text in chunks.
      # ============================================================
      - name: Send EOD report to Telegram
        if: steps.target.outputs.has_target == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_FILE: /tmp/eod/eod_report.md
          SCAN_DATE: ${{ steps.target.outputs.scan_date }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is missing"
            exit 1
          fi

          if [ ! -f "$REPORT_FILE" ]; then
            echo "ERROR: EOD report file not found"
            exit 1
          fi

          python3 << 'PYEOF'
          import os
          import sys
          import urllib.request
          import urllib.parse

          token = os.environ["TELEGRAM_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          report_file = os.environ["REPORT_FILE"]
          scan_date = os.environ["SCAN_DATE"]

          with open(report_file, "r", encoding="utf-8") as f:
              text = f.read().strip()

          if not text:
              text = f"DAYS-BOT V5.0.6\nEOD Report {scan_date}\n\nNo report content."

          header = f"DAYS-BOT V5.0.6 — EOD {scan_date}\n\n"

          # Telegram sendMessage limit is 4096 chars.
          max_len = 4000

          chunks = []

          while len(text) > max_len:
              split_at = text.rfind("\n", 0, max_len)

              if split_at < 500:
                  split_at = max_len

              chunks.append(text[:split_at].strip())
              text = text[split_at:].strip()

          if text:
              chunks.append(text)

          print(f"Telegram messages to send: {len(chunks)}")

          for i, chunk in enumerate(chunks, start=1):

              prefix = header if i == 1 else f"DAYS-BOT V5.0.6 — EOD {scan_date} ({i})\n\n"

              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": prefix + chunk
              }).encode("utf-8")

              url = f"https://api.telegram.org/bot{token}/sendMessage"

              request = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")

                  if '"ok":true' not in body:
                      print("Telegram API returned unexpected response:")
                      print(body)
                      sys.exit(1)

                  print(f"Telegram message {i}/{len(chunks)} sent.")

              except Exception as exc:
                  print(f"ERROR sending Telegram message {i}: {exc}")
                  sys.exit(1)

          print("PASS: EOD report sent to Telegram.")
          PYEOF

      # ============================================================
      # Upload evaluator output + report
      # ============================================================
      - name: Upload evaluator output + report
        if: always() && steps.target.outputs.has_target == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-${{ steps.target.outputs.scan_date }}-r${{ github.run_number }}
          path: |
            data/
            /tmp/eod/eod_report.md
          retention-days: 90
          if-no-files-found: warn