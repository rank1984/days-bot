name: DAYS-BOT V5.0.6 Evaluator

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Artifact name (empty = auto-detect latest for scan_date)'
        required: false
        default: ''
      artifact_run_id:
        description: 'Run ID (empty = auto)'
        required: false
        default: ''
      scan_date:
        description: 'Scan date YYYY-MM-DD (empty = latest with complete RTH)'
        required: false
        default: ''
  schedule:
    # 22:00 UTC = 18:00 ET (EDT) / 17:00 ET (EST)
    # After US market close (16:00 ET)
    - cron: '0 22 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=auto" >> $GITHUB_OUTPUT
          elif [ -z "${{ inputs.artifact_run_id }}" ]; then
            echo "mode=auto" >> $GITHUB_OUTPUT
          else
            echo "mode=manual" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p /tmp/artifact

      # ============================================================
      # Resolve target scan_date + artifact
      # ============================================================
      - name: Resolve target scan_date
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "manual" ]; then
            TARGET_DATE="${{ inputs.scan_date }}"
            ARTIFACT_NAME="${{ inputs.artifact_name }}"
            RUN_ID="${{ inputs.artifact_run_id }}"
          else
            # Auto mode
            NOW_HOUR_ET=$(TZ=America/New_York date +%H)
            TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
            YESTERDAY_ET=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d)

            if [ "10#$NOW_HOUR_ET" -lt "16" ]; then
              TARGET_DATE="$YESTERDAY_ET"
            else
              TARGET_DATE="$TODAY_ET"
            fi

            echo "[evaluate] Auto mode: now=${NOW_HOUR_ET} ET, target=${TARGET_DATE}"

            # Find most recent artifact matching scan-${TARGET_DATE}-r*
            FOUND=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name | startswith(\"scan-${TARGET_DATE}-\"))] | .[0] // empty")

            if [ -z "$FOUND" ]; then
              echo "[evaluate] No artifact found for $TARGET_DATE"
              echo "has_target=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            ARTIFACT_NAME=$(echo "$FOUND" | jq -r '.name')
            RUN_ID=$(echo "$FOUND" | jq -r '.workflow_run.id')
            echo "[evaluate] Found: $ARTIFACT_NAME (run $RUN_ID)"
          fi

          if [ -z "$TARGET_DATE" ] || [ -z "$ARTIFACT_NAME" ] || [ -z "$RUN_ID" ]; then
            echo "[evaluate] Incomplete target — aborting"
            echo "has_target=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "scan_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "has_target=true" >> $GITHUB_OUTPUT

      - name: Exit early if no target
        if: steps.target.outputs.has_target != 'true'
        run: |
          echo "No target artifact for evaluation — exiting cleanly."
          echo "This is expected if no scan ran today."

      - name: Download target artifact
        if: steps.target.outputs.has_target == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          run-id: ${{ steps.target.outputs.run_id }}
          path: /tmp/artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate alerts.db
        if: steps.target.outputs.has_target == 'true'
        run: |
          echo "=== Artifact contents ==="
          find /tmp/artifact -type f
          DB=$(find /tmp/artifact -name "alerts.db" -type f | head -1)
          if [ -z "$DB" ]; then
            echo "ERROR: alerts.db not found"
            exit 1
          fi
          cp "$DB" data/alerts.db
          ls -la data/

      - name: Verify snapshots
        if: steps.target.outputs.has_target == 'true'
        run: |
          python3 << 'PYEOF'
          import sqlite3
          conn = sqlite3.connect('data/alerts.db')
          cur = conn.cursor()
          rows = cur.execute(
              "SELECT scan_date, COUNT(*) FROM snapshots "
              "GROUP BY scan_date ORDER BY scan_date DESC LIMIT 5"
          ).fetchall()
          print("Snapshots by scan_date:")
          for r in rows: print(f"  {r[0]}: {r[1]}")
          conn.close()
          PYEOF

      # ============================================================
      # Run evaluator
      # ============================================================
      - name: Run evaluator
        if: steps.target.outputs.has_target == 'true'
        run: |
          echo "==================================================="
          echo "V5.0.6 EVALUATOR — scan_date=${{ steps.target.outputs.scan_date }}"
          echo "==================================================="
          python evaluate_snapshots.py --scan-date ${{ steps.target.outputs.scan_date }}

      # ============================================================
      # Generate EOD report
      # ============================================================
      - name: Generate EOD report
        if: steps.target.outputs.has_target == 'true'
        run: |
          python eod_report/generate_eod_report.py \
            --scan-date ${{ steps.target.outputs.scan_date }} \
            --output /tmp/eod_report.md
          echo "=== REPORT ==="
          cat /tmp/eod_report.md

      - name: Upload evaluator output + report
        if: always() && steps.target.outputs.has_target == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-${{ steps.target.outputs.scan_date }}-r${{ github.run_number }}
          path: |
            data/
            /tmp/eod_report.md
          retention-days: 90
          if-no-files-found: warn
