name: DAYS-BOT Swing Evaluator

on:
  workflow_dispatch: # מאפשר הרצה ידנית
  schedule:
    # ירוץ כל יום שני עד שישי ב-21:30 UTC (17:30 ET / 00:30 IL)
    # אחרי סגירת השוק, כדי לתפוס את הנתונים היומיים הסופיים
    - cron: '30 21 * * 1-5'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- שלב 1: הורדת ה-DB מהריצה האחרונה ----------
      - name: Find and Download Latest DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # מחפש את ה-workflow של הסורק (scan.yml)
          WF_FILE="scan.yml"
          
          # מוצא את הריצה המוצלחת האחרונה
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=10" \
            --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id' | head -n 1)
            
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful scan run found."
            exit 1
          fi
          
          echo "Downloading DB from run $RUN_ID..."
          
          # מוצא את הארטיפקט של ה-scan
          ART_NAME=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("scan-")) | .name' | head -n 1)
            
          # מוריד
          gh run download $RUN_ID -n "$ART_NAME" -D /tmp/latest_scan
          
          mkdir -p data
          cp /tmp/latest_scan/data/alerts.db data/alerts.db
          echo "DB restored. Size: $(ls -lh data/alerts.db | awk '{print $5}')"

      # ---------- שלב 2: הרצת ה-Evaluator ----------
      - name: Run Swing Evaluator
        run: |
          python3 scripts/evaluate_swing.py 2>&1 | tee -a evaluate_swing.log

      # ---------- שלב 3: העלאת ה-DB המעודכן כארטיפקט ----------
      - name: Upload Updated DB
        uses: actions/upload-artifact@v4
        with:
          name: evaluated-db-${{ github.run_id }}
          path: |
            data/alerts.db
            evaluate_swing.log
          retention-days: 14
