name: Test Alpaca API Keys

on:
  workflow_dispatch:

jobs:
  test-alpaca:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install alpaca-py
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py

      - name: Test Alpaca Connection
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'EOF'
          import os
          from alpaca.data.historical import StockHistoricalDataClient
          from alpaca.data.requests import StockBarsRequest
          from alpaca.data.timeframe import TimeFrame
          from datetime import datetime, timedelta

          API_KEY = os.environ.get('ALPACA_API_KEY')
          SECRET_KEY = os.environ.get('ALPACA_SECRET_KEY')

          print('=' * 60)
          print('🧪 TESTING ALPACA API CONNECTION (IEX feed)')
          print('=' * 60)

          if not API_KEY or not SECRET_KEY:
              print('❌ ERROR: ALPACA_API_KEY or ALPACA_SECRET_KEY is missing!')
              exit(1)

          print(f'✅ API Key found: {API_KEY[:8]}...')
          print(f'✅ Secret Key found: {SECRET_KEY[:8]}...')

          try:
              client = StockHistoricalDataClient(API_KEY, SECRET_KEY)
              print('✅ Alpaca client created successfully')

              # Using IEX feed (available for free tier)
              req = StockBarsRequest(
                  symbol_or_symbols='AAPL',
                  timeframe=TimeFrame.Day,
                  start=datetime.now() - timedelta(days=5),
                  end=datetime.now(),
                  limit=10,
                  feed='iex'  # <-- CRITICAL: use IEX for free tier
              )

              print('📡 Fetching AAPL daily bars (IEX feed)...')
              bars = client.get_stock_bars(req)
              data = bars.data.get('AAPL', [])

              if data:
                  print(f'✅ Successfully received {len(data)} bars for AAPL')
                  print(f'   Latest close: ${data[-1].close:.2f}')
                  print('🎉 Alpaca API is working correctly with IEX feed!')
              else:
                  print('⚠️ Got response but no data for AAPL (may be weekend/holiday)')
                  print('   Alpaca API connection is working.')

          except Exception as e:
              print(f'❌ ERROR: {e}')
              print('   Check your API keys and permissions.')
              print('   Make sure you are using PAPER TRADING keys, not LIVE.')
              exit(1)

          print('=' * 60)
          print('✅ TEST COMPLETE')
          print('=' * 60)
          EOF
