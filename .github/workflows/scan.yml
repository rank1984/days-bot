name: Market Scanner Workflow

on:
  schedule:
    # Runs during Premarket window (04:00 ET - 09:15 ET)
    # 08:00 UTC = 04:00 ET | 13:15 UTC = 09:15 ET
    - cron: '*/15 8-13 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution outside Premarket window (--force)'
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directory
        run: mkdir -p data

      - name: Run Main Scanner Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "[Workflow] Manual trigger detected – running with --force"
            python main.py scan --force
          else
            echo "[Workflow] Scheduled trigger detected – running standard scan"
            python main.py scan
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db
          path: data/alerts.db
