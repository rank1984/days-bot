name: DAYS-BOT V5.0.5.2 Trading Scanner

on:
  schedule:
    # 10 runs during Premarket (EDT)
    - cron: "0 9 * * 1-5"     # 05:00 ET
    - cron: "0 10 * * 1-5"    # 06:00 ET
    - cron: "0 11 * * 1-5"    # 07:00 ET
    - cron: "30 11 * * 1-5"   # 07:30 ET
    - cron: "0 12 * * 1-5"    # 08:00 ET
    - cron: "15 12 * * 1-5"   # 08:15 ET
    - cron: "30 12 * * 1-5"   # 08:30 ET
    - cron: "45 12 * * 1-5"   # 08:45 ET
    - cron: "0 13 * * 1-5"    # 09:00 ET
    - cron: "15 13 * * 1-5"   # 09:15 ET

  workflow_dispatch:

  push:
    branches:
      - main
      - master

concurrency:
  group: days-bot-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show runtime information
        run: |
          echo "=============================================="
          echo "DAYS-BOT V5.0.5.2"
          echo "Research Scanner"
          echo "=============================================="
          echo "UTC time:  $(date -u)"
          echo "ET time:   $(TZ=America/New_York date)"
          echo "Git SHA:   $GITHUB_SHA"
          echo "Event:     ${{ github.event_name }}"
          echo "Run #:     ${{ github.run_number }}"
          echo "=============================================="

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directories
        run: |
          mkdir -p data
          mkdir -p data/logs
          mkdir -p data/replay
          mkdir -p data/learning

      - name: Run DAYS-BOT V5.0.5.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[Workflow] Manual execution"
            python main.py fullscan_v34 --manual
          else
            echo "[Workflow] Scheduled execution"
            python main.py fullscan_v34
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-bot-v5052-${{ github.run_number }}
          path: |
            data/alerts.db
            data/replay/
            data/learning/
          if-no-files-found: warn
          retention-days: 30
