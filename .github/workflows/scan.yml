name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'learning/**'
      - 'database/**'
      - 'risk/**'
      - 'utils/**'
      - 'main.py'
      - 'requirements.txt'
  schedule:
    # 10 runs premarket — UTC = ET+4 (EDT) / ET+5 (EST)
    - cron: '0 9 * * 1-5'    # 05:00 ET
    - cron: '30 9 * * 1-5'   # 05:30 ET
    - cron: '0 10 * * 1-5'   # 06:00 ET
    - cron: '30 10 * * 1-5'  # 06:30 ET
    - cron: '0 11 * * 1-5'   # 07:00 ET
    - cron: '30 11 * * 1-5'  # 07:30 ET
    - cron: '0 12 * * 1-5'   # 08:00 ET
    - cron: '30 12 * * 1-5'  # 08:30 ET
    - cron: '0 13 * * 1-5'   # 09:00 ET
    - cron: '15 13 * * 1-5'  # 09:15 ET

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      # ============================================================
      # Restore previous same-day DB (artifact chaining)
      # ============================================================
      - name: Find previous same-day artifact
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "Scan date: $TODAY"

          # Find most recent successful scan run before current
          PREV_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=30&status=success" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | .[0].id // empty")

          if [ -z "$PREV_RUN" ]; then
            echo "[restore] No previous run found — fresh DB"
            echo "has_prev=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "[restore] Previous run: $PREV_RUN"

          # Verify it's from today (UTC comparison is close enough)
          PREV_DATE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/$PREV_RUN" \
            --jq '.run_started_at' | cut -c1-10)
          TODAY_UTC=$(date -u +%Y-%m-%d)
          YESTERDAY_UTC=$(date -u -d 'yesterday' +%Y-%m-%d)

          if [ "$PREV_DATE" != "$TODAY_UTC" ] && [ "$PREV_DATE" != "$YESTERDAY_UTC" ]; then
            echo "[restore] Previous run from $PREV_DATE — too old, skipping"
            echo "has_prev=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get artifact name
          ARTIFACT_NAME=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/$PREV_RUN/artifacts" \
            --jq '.artifacts[0].name // empty')

          if [ -z "$ARTIFACT_NAME" ]; then
            echo "[restore] No artifact in previous run"
            echo "has_prev=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "[restore] Artifact: $ARTIFACT_NAME"
          echo "has_prev=true" >> $GITHUB_OUTPUT
          echo "prev_run=$PREV_RUN" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Download previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          run-id: ${{ steps.restore.outputs.prev_run }}
          path: /tmp/prev/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB from previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          if [ -f /tmp/prev/alerts.db ]; then
            cp /tmp/prev/alerts.db data/alerts.db
            echo "[restore] DB copied from /tmp/prev/alerts.db"
          elif [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
            echo "[restore] DB copied from /tmp/prev/data/alerts.db"
          else
            echo "[restore] No DB found in artifact — fresh start"
          fi
          ls -la data/

      # ============================================================
      # Run scanner (appends to restored DB)
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      # ============================================================
      # DB Integrity
      # ============================================================
      - name: DB Integrity Check
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, json, sys, os
          if not os.path.exists('data/alerts.db'):
              print("ERROR: DB not found"); sys.exit(1)
          conn = sqlite3.connect('data/alerts.db')
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()
          print()
          print("=" * 74)
          print("DB INTEGRITY CHECK (V5.0.5.2.6)")
          print("=" * 74)
          row = cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1").fetchone()
          if not row:
              print("  No rows - skipping"); sys.exit(0)
          scan_date = row["scan_date"]
          print(f"  Checking scan_date = {scan_date}")
          mismatches = 0
          for r in cur.execute(
              "SELECT ticker, composite_score, raw_candidate_json FROM alerts WHERE scan_date = ? ORDER BY id DESC",
              (scan_date,)
          ):
              ticker, db_c, raw_json = r["ticker"], r["composite_score"], r["raw_candidate_json"]
              if not raw_json: continue
              try: raw = json.loads(raw_json)
              except: mismatches += 1; continue
              raw_c = raw.get("composite_score")
              if db_c is not None and raw_c is not None:
                  if abs(float(db_c) - float(raw_c)) >= 0.01:
                      print(f"  MISMATCH {ticker}: DB={db_c} RAW={raw_c}")
                      mismatches += 1
          print(f"  MISMATCHES: {mismatches}")
          print("=" * 74)
          if mismatches > 0:
              print(f"FAIL: {mismatches} mismatch(es)"); sys.exit(1)
          print("PASS: DB matches RAW JSON")
          PYEOF

      - name: Verify PM bars JSON
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, json, os, sys
          if not os.path.exists('data/alerts.db'): sys.exit(0)
          conn = sqlite3.connect('data/alerts.db')
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()
          row = cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1").fetchone()
          if not row: sys.exit(0)
          scan_date = row["scan_date"]
          print()
          print("=" * 74)
          print(f"PM BARS JSON VERIFICATION — {scan_date}")
          print("=" * 74)
          mismatch = 0
          for r in cur.execute(
              "SELECT ticker, pm_bars, pm_bars_json FROM alerts WHERE scan_date = ? ORDER BY id DESC",
              (scan_date,)
          ):
              ticker, pm_bars, raw = r["ticker"], r["pm_bars"] or 0, r["pm_bars_json"]
              if raw is None: json_count = 0
              else:
                  try: json_count = len(json.loads(raw))
                  except: json_count = -1
              status = "OK" if pm_bars == json_count else "MISMATCH"
              if status == "MISMATCH": mismatch += 1
              print(f"  {ticker:8s} | pm_bars={pm_bars:>3} | json={json_count:>3} | {status}")
          print("=" * 74)
          PYEOF

      - name: Verify V5.0.6 Schema
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, os, sys
          if not os.path.exists('data/alerts.db'): sys.exit(0)
          conn = sqlite3.connect('data/alerts.db')
          cur = conn.cursor()
          print()
          print("V5.0.6 SCHEMA VERIFICATION")
          print("=" * 74)
          for table, col in [("snapshots","pm_bars_json"),
                              ("trigger_results","trigger_data_mode"),
                              ("outcomes","trigger_result_id")]:
              cur.execute(f"PRAGMA table_info({table})")
              cols = {row[1] for row in cur.fetchall()}
              print(f"  {table:20s}.{col:25s} : {'present' if col in cols else 'MISSING'}")
          for table in ("snapshots", "trigger_results", "outcomes"):
              n = cur.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"  {table:20s} rows: {n}")
          print("=" * 74)
          PYEOF

      # ============================================================
      # Upload artifact with date+run scoping
      # ============================================================
      - name: Upload daily artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.restore.outputs.today }}-r${{ github.run_number }}
          path: data/
          retention-days: 30
          if-no-files-found: warn