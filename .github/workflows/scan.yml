name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scanner/**'
      - 'learning/**'
      - 'database/**'
      - 'risk/**'
      - 'utils/**'
      - 'main.py'
      - 'requirements.txt'
  schedule:
    # 10 runs during premarket ET (UTC = ET + 4 during EDT)
    - cron: '0 9 * * 1-5'    # 05:00 ET
    - cron: '30 9 * * 1-5'   # 05:30 ET
    - cron: '0 10 * * 1-5'   # 06:00 ET
    - cron: '30 10 * * 1-5'  # 06:30 ET
    - cron: '0 11 * * 1-5'   # 07:00 ET
    - cron: '30 11 * * 1-5'  # 07:30 ET
    - cron: '0 12 * * 1-5'   # 08:00 ET
    - cron: '30 12 * * 1-5'  # 08:30 ET
    - cron: '0 13 * * 1-5'   # 09:00 ET
    - cron: '15 13 * * 1-5'  # 09:15 ET

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      - name: DB Integrity Check
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, json, sys, os
          db_path = 'data/alerts.db'
          if not os.path.exists(db_path):
              print(f"DB not found at {db_path}")
              sys.exit(1)
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()
          print()
          print("=" * 74)
          print("DB INTEGRITY CHECK (V5.0.5.2.6)")
          print("=" * 74)
          cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1")
          row = cur.fetchone()
          if not row:
              print("  No rows - skipping")
              sys.exit(0)
          latest_scan_date = row["scan_date"]
          print(f"  Checking scan_date = {latest_scan_date}")
          mismatches = 0
          checked = 0
          print()
          print(f"  {'ticker':8s} | {'DB_comp':>8s} | {'RAW_comp':>9s} | {'MATCH':>7s}")
          print("  " + "-" * 50)
          for r in cur.execute(
              """SELECT ticker, composite_score, raw_candidate_json
                 FROM alerts WHERE scan_date = ? ORDER BY id DESC""",
              (latest_scan_date,)
          ):
              ticker = r["ticker"]
              db_c = r["composite_score"]
              raw_json = r["raw_candidate_json"]
              checked += 1
              if not raw_json:
                  print(f"  {ticker:8s} | {str(db_c):>8s} | {'<no-raw>':>9s} | {'SKIP':>7s}")
                  continue
              try:
                  raw = json.loads(raw_json)
              except Exception:
                  mismatches += 1
                  continue
              raw_c = raw.get("composite_score")
              match = "?"
              if db_c is not None and raw_c is not None:
                  match = "OK" if abs(float(db_c) - float(raw_c)) < 0.01 else "MISMATCH"
                  if match == "MISMATCH": mismatches += 1
              elif db_c is None and raw_c is None:
                  match = "both-null"
              print(f"  {ticker:8s} | {str(db_c):>8s} | {str(raw_c):>9s} | {match:>7s}")
          print("  " + "-" * 50)
          print(f"  Rows checked: {checked} | MISMATCHES: {mismatches}")
          print("=" * 74)
          if mismatches > 0:
              print(f"FAIL: {mismatches} mismatch(es)")
              sys.exit(1)
          print("PASS: All DB composite_score values match RAW JSON")
          PYEOF

      - name: Verify PM bars JSON
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, json, os, sys
          db_path = 'data/alerts.db'
          if not os.path.exists(db_path): sys.exit(0)
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()
          cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1")
          row = cur.fetchone()
          if not row: sys.exit(0)
          scan_date = row["scan_date"]
          print()
          print("=" * 74)
          print(f"PM BARS JSON VERIFICATION — {scan_date}")
          print("=" * 74)
          mismatch = 0
          for r in cur.execute(
              """SELECT ticker, pm_bars, pm_bars_json FROM alerts
                 WHERE scan_date = ? ORDER BY id DESC""",
              (scan_date,)
          ):
              ticker = r["ticker"]
              pm_bars = r["pm_bars"] or 0
              raw = r["pm_bars_json"]
              if raw is None: json_count = 0
              else:
                  try: json_count = len(json.loads(raw))
                  except: json_count = -1
              status = "OK" if pm_bars == json_count else "MISMATCH"
              if status == "MISMATCH": mismatch += 1
              print(f"  {ticker:8s} | pm_bars={pm_bars:>3} | json={json_count:>3} | {status}")
          print("=" * 74)
          PYEOF

      - name: Verify V5.0.6 Schema
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, os, sys
          db_path = 'data/alerts.db'
          if not os.path.exists(db_path): sys.exit(0)
          conn = sqlite3.connect(db_path)
          cur = conn.cursor()
          print()
          print("V5.0.6 SCHEMA VERIFICATION")
          print("=" * 74)
          for table, col in [("snapshots","pm_bars_json"),
                              ("trigger_results","trigger_data_mode"),
                              ("outcomes","trigger_result_id")]:
              cur.execute(f"PRAGMA table_info({table})")
              cols = {row[1] for row in cur.fetchall()}
              print(f"  {table:20s}.{col:25s} : {'present' if col in cols else 'MISSING'}")
          for table in ("snapshots", "trigger_results", "outcomes"):
              n = cur.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print(f"  {table:20s} rows: {n}")
          print("=" * 74)
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-bot-v506-${{ github.run_number }}
          path: data/
          retention-days: 14
          if-no-files-found: warn
