name: DAYS-BOT

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 08:00 ET
    - cron: '15 12 * * 1-5'  # 08:15 ET
    - cron: '30 12 * * 1-5'  # 08:30 ET
    - cron: '45 12 * * 1-5'  # 08:45 ET
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. SCAN – הרצת הבדיקה המהירה (quick_test.py)
  # ============================================================
  scan:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Run quick test
        run: python quick_test.py
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: data/alerts.db

  # ============================================================
  # 2. TRIGGER MONITOR – מעקב אלרט ומעבר ל-READY
  # ============================================================
  trigger_monitor:
    runs-on: ubuntu-latest
    needs: scan
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: alerts-db-${{ github.run_id }}-*
          path: data/
          merge-multiple: true
      - name: Run trigger monitor
        run: python trigger_monitor.py
      - name: Upload updated DB
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-${{ github.run_id }}-trigger
          path: data/alerts.db

  # ============================================================
  # 3. ENTRY – ביצוע PaperTrades
  # ============================================================
  entry:
    runs-on: ubuntu-latest
    needs: trigger_monitor
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: alerts-db-${{ github.run_id }}-trigger
          path: data/
          merge-multiple: true
      - name: Run entry (trades)
        run: python main.py entry
      - name: Upload final DB
        uses: actions/upload-artifact@v4
        with:
          name: final-trades-db-${{ github.run_id }}
          path: data/alerts.db

  # ============================================================
  # 4. MONITOR – מעקב TP/Stop
  # ============================================================
  monitor:
    runs-on: ubuntu-latest
    needs: entry
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: final-trades-db-${{ github.run_id }}
          path: data/
          merge-multiple: true
      - name: Run monitor
        run: python trade_monitor.py
      - name: Upload updated DB
        uses: actions/upload-artifact@v4
        with:
          name: updated-trades-db-${{ github.run_id }}
          path: data/alerts.db

  # ============================================================
  # 5. EDGE REPORT – ניתוח ביצועים
  # ============================================================
  edge_report:
    runs-on: ubuntu-latest
    needs: monitor
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: updated-trades-db-${{ github.run_id }}
          path: data/
          merge-multiple: true
      - name: Run Edge Report
        run: python edge_report.py > edge_report_output.txt
      - name: Upload Edge Report
        uses: actions/upload-artifact@v4
        with:
          name: edge-report-${{ github.run_id }}
          path: edge_report_output.txt
