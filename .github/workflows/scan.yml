name: DAYS-BOT V5.0.5.2 Trading Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scanner/**'
      - 'learning/**'
      - 'database/**'
      - 'risk/**'
      - 'utils/**'
      - 'main.py'
      - 'requirements.txt'
  schedule:
    # 10 runs during premarket (times in UTC)
    # 05:00, 05:30, 06:00, 06:30, 07:00, 07:30, 08:00, 08:30, 09:00, 09:15 ET
    # ET = UTC-4 (EDT) → UTC = ET + 4
    - cron: '0 9 * * 1-5'    # 05:00 ET
    - cron: '30 9 * * 1-5'   # 05:30 ET
    - cron: '0 10 * * 1-5'   # 06:00 ET
    - cron: '30 10 * * 1-5'  # 06:30 ET
    - cron: '0 11 * * 1-5'   # 07:00 ET
    - cron: '30 11 * * 1-5'  # 07:30 ET
    - cron: '0 12 * * 1-5'   # 08:00 ET
    - cron: '30 12 * * 1-5'  # 08:30 ET
    - cron: '0 13 * * 1-5'   # 09:00 ET
    - cron: '15 13 * * 1-5'  # 09:15 ET

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python setup
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. Prepare data directory
      # ============================================================
      - name: Prepare data directory
        run: mkdir -p data

      # ============================================================
      # 5. DIAGNOSTIC - find evaluation code
      #    (TEMPORARY - remove after identifying V5.0.6 Runner)
      # ============================================================
      - name: DIAGNOSTIC - find evaluation code
        run: |
          echo "==================================================="
          echo "REPO DIAGNOSTIC - V5.0.6 Evaluation Code Search"
          echo "==================================================="

          echo ""
          echo "=== [1] ALL .py FILES IN REPO ==="
          find . -name "*.py" -not -path "*/.git/*" | sort

          echo ""
          echo "=== [2] FILES WITH EVALUATION KEYWORDS IN NAME ==="
          find . -name "*.py" -not -path "*/.git/*" | grep -iE "outcome|trigger|backtest|measure|evaluate|snapshot" || echo "  -> NONE FOUND"

          echo ""
          echo "=== [3] CODE WRITING TO evaluation TABLES ==="
          grep -rn "INSERT INTO outcomes\|INSERT INTO trigger_results\|save_outcome\|save_trigger\|evaluate_snapshot\|run_evaluation" --include="*.py" . || echo "  -> NONE FOUND"

          echo ""
          echo "=== [4] FILES MENTIONING THE 3 NEW TABLES ==="
          grep -rln "snapshots" --include="*.py" . || echo "  -> NO 'snapshots' matches"
          echo "---"
          grep -rln "trigger_results" --include="*.py" . || echo "  -> NO 'trigger_results' matches"
          echo "---"
          grep -rln "outcomes" --include="*.py" . || echo "  -> NO 'outcomes' matches"

          echo ""
          echo "=== [5] DIRECTORY STRUCTURE ==="
          find . -type d -not -path "*/.git/*" -not -path "*/node_modules/*" | sort

          echo ""
          echo "==================================================="
          echo "END DIAGNOSTIC"
          echo "==================================================="

      # ============================================================
      # 6. Run scanner
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[Workflow] Manual execution"
            python main.py fullscan_v34 --manual
          else
            echo "[Workflow] Scheduled execution"
            python main.py fullscan_v34
          fi

      # ============================================================
      # 7. DB Integrity Check (V5.0.5.2.6)
      # ============================================================
      - name: DB Integrity Check
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import json
          import sys
          import os

          db_path = 'data/alerts.db'
          if not os.path.exists(db_path):
              print(f"DB not found at {db_path}")
              sys.exit(1)

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()

          print()
          print("=" * 74)
          print("DB INTEGRITY CHECK (V5.0.5.2.6)")
          print("=" * 74)

          cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1")
          row = cur.fetchone()
          if not row:
              print("  No rows in alerts table - skipping integrity check")
              print("=" * 74)
              sys.exit(0)

          latest_scan_date = row["scan_date"]
          print(f"  Checking scan_date = {latest_scan_date}")

          mismatches = 0
          checked = 0
          missing_raw = 0
          null_db = 0

          print()
          print(f"  {'ticker':8s} | {'DB_comp':>8s} | {'RAW_comp':>9s} | "
                f"{'DB_swing':>8s} | {'RAW_swing':>9s} | {'MATCH':>7s}")
          print("  " + "-" * 72)

          for r in cur.execute(
              """SELECT ticker, composite_score, swing_score, raw_candidate_json
                 FROM alerts WHERE scan_date = ?
                 ORDER BY id DESC""",
              (latest_scan_date,)
          ):
              ticker = r["ticker"]
              db_c = r["composite_score"]
              db_s = r["swing_score"]
              raw_json = r["raw_candidate_json"]

              checked += 1

              if not raw_json:
                  missing_raw += 1
                  print(f"  {ticker:8s} | {str(db_c):>8s} | {'<no-raw>':>9s} | "
                        f"{str(db_s):>8s} | {'<no-raw>':>9s} | {'SKIP':>7s}")
                  continue

              try:
                  raw = json.loads(raw_json)
              except Exception as e:
                  print(f"  {ticker:8s} | JSON PARSE ERROR: {e}")
                  mismatches += 1
                  continue

              raw_c = raw.get("composite_score")
              raw_s = raw.get("swing_score")

              if db_c is None:
                  null_db += 1

              comp_match = "?"
              if db_c is not None and raw_c is not None:
                  if abs(float(db_c) - float(raw_c)) < 0.01:
                      comp_match = "OK"
                  else:
                      comp_match = "MISMATCH"
                      mismatches += 1
              elif db_c is None and raw_c is None:
                  comp_match = "both-null"

              print(f"  {ticker:8s} | {str(db_c):>8s} | {str(raw_c):>9s} | "
                    f"{str(db_s):>8s} | {str(raw_s):>9s} | {comp_match:>7s}")

          print("  " + "-" * 72)
          print(f"  Rows checked:      {checked}")
          print(f"  Missing RAW JSON:  {missing_raw}")
          print(f"  NULL DB value:     {null_db}")
          print(f"  MISMATCHES:        {mismatches}")
          print("=" * 74)

          if mismatches > 0:
              print()
              print(f"FAIL: {mismatches} composite_score mismatch(es) detected")
              print("   DB column does NOT match RAW JSON.")
              print("   Do NOT trust this run's data - investigate before proceeding.")
              sys.exit(1)

          print()
          print("PASS: All DB composite_score values match RAW JSON")
          sys.exit(0)
          PYEOF

      # ============================================================
      # 8. V5.0.6 Snapshots - verify pm_bars_json
      # ============================================================
      - name: Verify PM bars JSON
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import os
          import sys

          db_path = 'data/alerts.db'
          if not os.path.exists(db_path):
              print("DB not found - skipping")
              sys.exit(0)

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()

          print()
          print("=" * 74)
          print("PM BARS JSON VERIFICATION (V5.0.5.2.6)")
          print("=" * 74)

          cur.execute("SELECT DISTINCT scan_date FROM alerts ORDER BY scan_date DESC LIMIT 1")
          row = cur.fetchone()
          if not row:
              print("  No rows - skipping")
              sys.exit(0)

          scan_date = row["scan_date"]
          print(f"  Checking scan_date = {scan_date}")
          print()

          mismatch = 0
          for r in cur.execute(
              """SELECT ticker, pm_bars, pm_bars_json
                 FROM alerts WHERE scan_date = ?
                 ORDER BY id DESC""",
              (scan_date,)
          ):
              ticker = r["ticker"]
              pm_bars = r["pm_bars"] or 0
              raw = r["pm_bars_json"]

              if raw is None:
                  json_count = 0
              else:
                  try:
                      import json
                      json_count = len(json.loads(raw))
                  except Exception:
                      json_count = -1

              status = "OK" if pm_bars == json_count else "MISMATCH"
              if status == "MISMATCH":
                  mismatch += 1

              print(f"  {ticker:8s} | pm_bars={pm_bars:>3} | json_count={json_count:>3} | {status}")

          print()
          if mismatch > 0:
              print(f"  WARNING: {mismatch} mismatch(es) in pm_bars_json")
          else:
              print("  All pm_bars counts match JSON array lengths")
          print("=" * 74)
          PYEOF

      # ============================================================
      # 9. Upload artifact
      # ============================================================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-bot-v5052-${{ github.run_number }}
          path: data/
          retention-days: 14
          if-no-files-found: warn
