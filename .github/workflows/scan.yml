name: DAYS-BOT V5.0.5.1 Trading Scanner

on:
  schedule:
    # 08:45 ET (12:45 UTC in EDT)
    - cron: "45 12 * * 1-5"
    # 09:00 ET (13:00 UTC in EDT)
    - cron: "0 13 * * 1-5"
    # 09:15 ET (13:15 UTC in EDT)
    - cron: "15 13 * * 1-5"
  
  # Manual trigger
  workflow_dispatch:
  
  # Trigger on push to main (keeps workflow alive)
  push:
    branches:
      - main
      - master

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show current time (UTC + ET)
        run: |
          echo "UTC: $(date -u)"
          echo "ET:  $(TZ=America/New_York date)"
          echo "Git SHA: $GITHUB_SHA"
          echo "Event: ${{ github.event_name }}"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directory
        run: mkdir -p data

      - name: Run DAYS-BOT V5.0.5.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[Workflow] Manual execution"
            python main.py fullscan_v34 --manual
          else
            echo "[Workflow] Scheduled execution"
            python main.py fullscan_v34
          fi

      - name: Upload Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-v5051-${{ github.run_number }}
          path: data/alerts.db
          if-no-files-found: warn
          retention-days: 30