name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: '2 12 * * 1-5'
    - cron: '12 12 * * 1-5'
    - cron: '22 12 * * 1-5'
    - cron: '32 12 * * 1-5'
    - cron: '42 12 * * 1-5'
    - cron: '52 12 * * 1-5'
    - cron: '2 13 * * 1-5'
    - cron: '12 13 * * 1-5'
    - cron: '22 13 * * 1-5'
    - cron: '25 13 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: |
          mkdir -p data

      - name: Determine scan date
        id: date
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          NOW_ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          NOW_UTC=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          NOW_IL=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M:%S %Z')
          echo "today=$TODAY_ET" >> "$GITHUB_OUTPUT"
          echo "=================================================="
          echo "DAYS-BOT V5.0.6 SCAN"
          echo "GitHub run:    ${{ github.run_id }}"
          echo "Run number:    ${{ github.run_number }}"
          echo "Event:         ${{ github.event_name }}"
          echo "UTC time:      $NOW_UTC"
          echo "ET time:       $NOW_ET"
          echo "Israel time:   $NOW_IL"
          echo "Scan date ET:  $TODAY_ET"
          echo "=================================================="

      - name: Find previous same-day scan artifact
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY_ET: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          echo "Looking for previous successful scan run for ET date: $TODAY_ET"
          PREV_RUN=""
          while IFS=$'\t' read -r RUN_ID RUN_STARTED_AT RUN_NUMBER; do
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then
              continue
            fi
            RUN_DATE_ET=$(TZ=America/New_York date -d "$RUN_STARTED_AT" +%Y-%m-%d)
            echo "Candidate run=$RUN_ID number=$RUN_NUMBER started=$RUN_STARTED_AT ET_date=$RUN_DATE_ET"
            if [ "$RUN_DATE_ET" = "$TODAY_ET" ]; then
              PREV_RUN="$RUN_ID"
              PREV_RUN_NUMBER="$RUN_NUMBER"
              break
            fi
          done < <(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=100&status=success" \
              --jq '.workflow_runs[] | [.id, .run_started_at, .run_number] | @tsv'
          )
          if [ -z "${PREV_RUN:-}" ]; then
            echo "[restore] No previous successful scan run found for $TODAY_ET"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[restore] Previous same-day run:"
          echo "  run_id=$PREV_RUN"
          echo "  run_number=$PREV_RUN_NUMBER"
          EXPECTED_ARTIFACT="scan-${TODAY_ET}-r${PREV_RUN_NUMBER}"
          echo "[restore] Looking for artifact: $EXPECTED_ARTIFACT"
          ARTIFACT_EXISTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/$PREV_RUN/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name == \"$EXPECTED_ARTIFACT\") and (.expired == false)] | length")
          if [ "$ARTIFACT_EXISTS" -eq 0 ]; then
            echo "[restore] Expected artifact not found: $EXPECTED_ARTIFACT"
            echo "[restore] Starting with fresh DB"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[restore] Artifact found: $EXPECTED_ARTIFACT"
          echo "has_prev=true" >> "$GITHUB_OUTPUT"
          echo "prev_run=$PREV_RUN" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$EXPECTED_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          run-id: ${{ steps.restore.outputs.prev_run }}
          path: /tmp/prev/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB from previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          echo "=== Previous artifact contents ==="
          find /tmp/prev -maxdepth 4 -type f -print || true
          DB_PATH=""
          if [ -f "/tmp/prev/alerts.db" ]; then
            DB_PATH="/tmp/prev/alerts.db"
          elif [ -f "/tmp/prev/data/alerts.db" ]; then
            DB_PATH="/tmp/prev/data/alerts.db"
          fi
          if [ -z "$DB_PATH" ]; then
            echo "ERROR: alerts.db not found in previous artifact"
            exit 1
          fi
          cp "$DB_PATH" data/alerts.db
          echo "[restore] DB restored:"
          ls -lh data/alerts.db

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          echo "Running DAYS-BOT V5.0.6 scanner..."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      - name: Verify schema
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3, os
          if not os.path.exists('data/alerts.db'):
              print("DB not found"); raise SystemExit(0)
          conn = sqlite3.connect('data/alerts.db')
          cur = conn.cursor()
          print()
          print("V5.0.6 SCHEMA VERIFICATION")
          print("=" * 74)
          for table, col in [("snapshots","pm_bars_json"),
                              ("trigger_results","trigger_data_mode"),
                              ("outcomes","trigger_result_id"),
                              ("outcomes","net_r_status")]:
              cur.execute("PRAGMA table_info(" + table + ")")
              cols = {row[1] for row in cur.fetchall()}
              print("  " + table + "." + col + " : " + ("present" if col in cols else "MISSING"))
          for table in ("snapshots", "trigger_results", "outcomes"):
              n = cur.execute("SELECT COUNT(*) FROM " + table).fetchone()[0]
              print("  " + table + " rows: " + str(n))
          print("=" * 74)
          conn.close()
          PYEOF

      - name: Upload daily artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.date.outputs.today }}-r${{ github.run_number }}
          path: data/
          retention-days: 30
          if-no-files-found: warn