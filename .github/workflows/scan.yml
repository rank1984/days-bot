name: DAYS-BOT Scan

on:
  schedule:
    # Premarket scans — America/New_York
    # 08:00 → 09:25 ET, every 10 minutes + final 09:25 capture
    - cron: "0 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "10 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "20 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "40 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "50 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "10 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "20 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "25 9 * * 1-5"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: |
          mkdir -p data

      - name: Restore previous DB artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: scan.yml
          name: days-bot-db
          path: data
          search_artifacts: true
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Run full scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py full

      - name: Verify database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("data/alerts.db")

          if not db.exists():
              raise SystemExit("ERROR: data/alerts.db was not created")

          conn = sqlite3.connect(db)
          cur = conn.cursor()

          tables = {
              row[0]
              for row in cur.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }

          print("DB:", db)
          print("Tables:", sorted(tables))

          required = {"alerts"}
          missing = required - tables

          if missing:
              raise SystemExit(f"ERROR: missing required tables: {missing}")

          conn.close()
          PY

      - name: Verify PM bars capture
        run: |
          python - <<'PY'
          import sqlite3
          import json
          from pathlib import Path

          db = Path("data/alerts.db")

          if not db.exists():
              raise SystemExit("ERROR: alerts.db missing")

          conn = sqlite3.connect(db)
          cur = conn.cursor()

          cols = {
              row[1]
              for row in cur.execute("PRAGMA table_info(alerts)")
          }

          if "pm_bars_json" not in cols:
              raise SystemExit(
                  "ERROR: alerts.pm_bars_json column is missing"
              )

          rows = cur.execute("""
              SELECT ticker, pm_bars_json
              FROM alerts
              ORDER BY rowid DESC
              LIMIT 20
          """).fetchall()

          valid = 0

          for ticker, raw in rows:
              if not raw:
                  continue

              try:
                  bars = json.loads(raw)
                  if isinstance(bars, list) and len(bars) > 0:
                      valid += 1
                      print(
                          f"{ticker}: PM bars={len(bars)}"
                      )
              except Exception as exc:
                  print(
                      f"{ticker}: invalid pm_bars_json: {exc}"
                  )

          print(
              f"PM-bar verification: {valid}/{len(rows)} "
              "recent rows contain PM bars"
          )

          conn.close()
          PY

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: days-bot-db
          path: data/*.db
          if-no-files-found: error
          retention-days: 14