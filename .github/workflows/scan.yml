name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:
  schedule:
    # Target PM window: 04:00-09:30 ET (11:00-16:30 IDT).
    #
    # GitHub Actions delay at scheduled times has grown to ~8 hours
    # during peak US hours (observed 2026-09-29: runs at 19:00-21:30 IDT
    # instead of the intended 11:00-15:30 IDT).
    #
    # Compensation: schedule 8h earlier so actual run lands in PM.
    #
    # If delay = 8h:   runs at 08:00-13:00 UTC = 04:00-09:00 ET = PM ✓
    # If delay = 4h:   runs at 04:00-09:00 UTC = 00:00-05:00 ET = too early
    # If delay = 0h:   runs at 00:00-05:00 UTC = 20:00-00:00 ET = prev evening
    #
    # IN_PM_WINDOW flag in each run marks which runs actually landed in PM.
    #
    - cron: '02 0 * * 1-5'    # 00:02 UTC -> ~08:02 UTC -> 04:02 ET
    - cron: '32 0 * * 1-5'    # 00:32 UTC -> ~08:32 UTC -> 04:32 ET
    - cron: '02 1 * * 1-5'    # 01:02 UTC -> ~09:02 UTC -> 05:02 ET
    - cron: '32 1 * * 1-5'    # 01:32 UTC -> ~09:32 UTC -> 05:32 ET
    - cron: '02 2 * * 1-5'    # 02:02 UTC -> ~10:02 UTC -> 06:02 ET
    - cron: '32 2 * * 1-5'    # 02:32 UTC -> ~10:32 UTC -> 06:32 ET
    - cron: '02 3 * * 1-5'    # 03:02 UTC -> ~11:02 UTC -> 07:02 ET
    - cron: '32 3 * * 1-5'    # 03:32 UTC -> ~11:32 UTC -> 07:32 ET
    - cron: '02 4 * * 1-5'    # 04:02 UTC -> ~12:02 UTC -> 08:02 ET
    - cron: '32 4 * * 1-5'    # 04:32 UTC -> ~12:32 UTC -> 08:32 ET

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      - name: Determine scan date and PM window
        id: date
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          NOW_HHMM=$(TZ=America/New_York date +%H%M)
          NOW_ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          NOW_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          NOW_IL=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M:%S %Z')

          if [ "$NOW_HHMM" -ge "0400" ] && [ "$NOW_HHMM" -lt "0930" ]; then
            IN_PM_WINDOW=true
          else
            IN_PM_WINDOW=false
          fi

          echo "today=$TODAY_ET" >> "$GITHUB_OUTPUT"
          echo "now_utc=$NOW_UTC" >> "$GITHUB_OUTPUT"
          echo "now_hhmm=$NOW_HHMM" >> "$GITHUB_OUTPUT"
          echo "in_pm_window=$IN_PM_WINDOW" >> "$GITHUB_OUTPUT"

          echo "=================================================="
          echo "DAYS-BOT V5.0.6 SCAN"
          echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
          echo "Event:      ${{ github.event_name }}"
          echo "Git SHA:    ${{ github.sha }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "UTC:        $NOW_UTC"
          echo "ET:         $NOW_ET"
          echo "Israel:     $NOW_IL"
          echo "Scan date:  $TODAY_ET"
          echo "PM window:  $IN_PM_WINDOW (now=$NOW_HHMM ET)"
          echo "=================================================="

      - name: Find latest previous artifact (cumulative DB)
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for the most recent successful run of scan.yml ..."
          PREV_RUN=""
          PREV_RUN_NUMBER=""
          PREV_RUN_STARTED=""

          while IFS=$'\t' read -r RUN_ID RUN_STARTED_AT RUN_NUMBER; do
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then
              continue
            fi
            PREV_RUN="$RUN_ID"
            PREV_RUN_NUMBER="$RUN_NUMBER"
            PREV_RUN_STARTED="$RUN_STARTED_AT"
            break
          done < <(
            gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=50&status=success" \
              --jq '.workflow_runs[] | [.id, .run_started_at, .run_number] | @tsv'
          )

          if [ -z "${PREV_RUN:-}" ]; then
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "No previous successful run found - starting fresh DB."
            exit 0
          fi

          echo "Most recent successful run: $PREV_RUN (#$PREV_RUN_NUMBER) at $PREV_RUN_STARTED"

          ARTIFACT_NAME=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/$PREV_RUN/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("scan-")) and (.expired == false))] | sort_by(.created_at) | reverse | .[0].name // empty')

          if [ -z "$ARTIFACT_NAME" ]; then
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "No usable artifact on run $PREV_RUN - starting fresh DB."
            exit 0
          fi

          echo "Selected artifact: $ARTIFACT_NAME"
          echo "has_prev=true" >> "$GITHUB_OUTPUT"
          echo "prev_run=$PREV_RUN" >> "$GITHUB_OUTPUT"
          echo "prev_run_number=$PREV_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "prev_run_started=$PREV_RUN_STARTED" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          run-id: ${{ steps.restore.outputs.prev_run }}
          path: /tmp/prev/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          echo "Restoring DB from artifact: ${{ steps.restore.outputs.artifact_name }}"
          echo "From run: ${{ steps.restore.outputs.prev_run }} (#${{ steps.restore.outputs.prev_run_number }})"
          echo "Started:  ${{ steps.restore.outputs.prev_run_started }}"

          if [ -f /tmp/prev/alerts.db ]; then
            cp /tmp/prev/alerts.db data/alerts.db
          elif [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
          else
            echo "WARNING: alerts.db not found in artifact"
            find /tmp/prev -type f -maxdepth 3 || true
            echo "Starting with empty DB."
            exit 0
          fi

          echo "DB restored successfully."
          ls -lh data/alerts.db

      - name: DB pre-scan summary
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          python3 -c "
          import sqlite3, os
          p = 'data/alerts.db'
          if not os.path.exists(p):
              print('No DB file'); raise SystemExit
          c = sqlite3.connect(p); cur = c.cursor()
          try:
              print('Pre-scan DB state:')
              print('  snapshots:      ', cur.execute('SELECT COUNT(*) FROM snapshots').fetchone()[0])
              print('  alerts:         ', cur.execute('SELECT COUNT(*) FROM alerts').fetchone()[0])
              print('  outcomes:       ', cur.execute('SELECT COUNT(*) FROM outcomes').fetchone()[0])
              print('  trigger_results:', cur.execute('SELECT COUNT(*) FROM trigger_results').fetchone()[0])
              rows = cur.execute('SELECT MIN(scan_date), MAX(scan_date) FROM snapshots').fetchone()
              print('  scan_date range:', rows[0], '->', rows[1])
          except Exception as e:
              print('  (schema check failed:', e, ')')
          c.close()
          "

      - name: Write run_metadata.json
        run: python3 scripts/write_run_metadata.py

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          RESEARCH_MODE: "true"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      - name: Run research diagnostics
        if: always()
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
          IN_PM_WINDOW: ${{ steps.date.outputs.in_pm_window }}
        run: python3 scripts/research_diagnostics.py

      - name: Run PM forensics
        if: always()
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
          IN_PM_WINDOW: ${{ steps.date.outputs.in_pm_window }}
        run: python3 scripts/pm_forensics.py

      - name: Upload daily artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.date.outputs.today }}-r${{ github.run_number }}
          path: data/
          retention-days: 90
          if-no-files-found: warn