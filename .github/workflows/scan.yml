name: DAYS-BOT V5.0.6 Trading Scanner

on:
  schedule:
    - cron: '*/30 4-11 * * 1-5'   # 04:00–11:59 UTC = 00:00–07:59 ET
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 0. זמן ----------
      - name: Compute TODAY_ET
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Banner
        run: |
          echo "=================================================="
          echo "DAYS-BOT V5.0.6.5 SCAN"
          echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
          echo "Event:      ${{ github.event_name }}"
          echo "SHA:        ${{ github.sha }}"
          echo "UTC:        $(date -u +%FT%TZ)"
          echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
          echo "Israel:     $(TZ=Asia/Jerusalem date '+%F %T %Z')"
          echo "Scan date:  $TODAY_ET"
          echo "=================================================="

      # ---------- 1. Checkout ----------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- 2. Restore previous run artifact ----------
      - name: Find previous run with valid artifact
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for the most recent successful run with a valid artifact ..."
          PREV=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/runs?per_page=15" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"completed\") | .id" \
            | head -n 1)
          if [ -z "$PREV" ]; then
            echo "No previous run — starting fresh."
            echo "artifact=" >> $GITHUB_OUTPUT
            exit 0
          fi
          ART=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$PREV/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("scan-")) | .name' \
            | head -n 1)
          echo "run=$PREV"        >> $GITHUB_OUTPUT
          echo "artifact=$ART"    >> $GITHUB_OUTPUT
          echo "Selected: run=$PREV artifact=$ART"

      - name: Download previous artifact (DB + all_runs.csv)
        if: steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev

      - name: Restore DB and prior summaries
        if: steps.prev.outputs.artifact != ''
        run: |
          set -euo pipefail
          mkdir -p data summaries
          if [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
            echo "DB restored."
          fi
          if [ -f /tmp/prev/summaries/all_runs.csv ]; then
            cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
            echo "Prior all_runs.csv restored ($(wc -l < summaries/all_runs.csv) lines)."
          else
            echo "No prior all_runs.csv — will create new."
          fi

      # ---------- 3. Tests & migrations ----------
      - name: Outcome engine tests
        run: python3 tests/test_outcome_engine.py

      - name: Migrations
        run: |
          python3 scripts/migrate_event_rank.py
          python3 scripts/migrate_research_meta.py
          python3 scripts/migrate_cost_columns.py

      # ---------- 4. Preflight (soft) ----------
      - name: Preflight check
        continue-on-error: true
        run: python3 scripts/preflight.py || true

      # ---------- 5. Scanner (with log capture) ----------
      - name: Run scanner
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scan.py 2>&1 | tee scan.log
          echo "exit=$?" >> $GITHUB_OUTPUT

      # ---------- 6. Build run summary ----------
      - name: Build run_summary.json
        if: always()
        run: |
          if [ -f scan.log ]; then
            python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json
          else
            echo "{}" > run_summary.json
          fi
          echo "----- run_summary.json -----"
          cat run_summary.json || true

      # ---------- 7. Append to all_runs.csv ----------
      - name: Append to all_runs.csv
        if: always()
        run: |
          mkdir -p summaries
          if [ ! -f summaries/all_runs.csv ]; then
            # header only
            python3 - <<'PY'
import csv, os
fields = ["run_number","run_id","time_et","scan_date","event",
          "is_scheduled","in_pm_window","preflight_passed","universe",
          "strict","liquidity_rejects","dataquality_blocked","plan_blocked",
          "plan_blocked_list","top5_returned","pre_scan_snapshots",
          "post_scan_snapshots","generated_at_utc"]
if not os.path.exists("summaries/all_runs.csv"):
    with open("summaries/all_runs.csv","w",newline="",encoding="utf-8") as f:
        csv.DictWriter(f, fieldnames=fields).writeheader()
PY
          fi
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true
          echo "----- all_runs.csv -----"
          cat summaries/all_runs.csv || true

      # ---------- 8. Diagnostics ----------
      - name: Research diagnostics
        if: always()
        continue-on-error: true
        run: python3 scripts/research_diagnostics.py || true

      - name: PM forensics
        if: always()
        continue-on-error: true
        run: python3 scripts/pm_forensics.py || true

      # ---------- 9. Upload ----------
      - name: Upload scan artifact (DB + summary + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload daily aggregate (rolling, overwrite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
