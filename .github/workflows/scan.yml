name: DAYS-BOT

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 08:30 ET / 15:30 ישראל – סריקת pre-market וכניסה לעסקאות
    - cron: "0 3 * * 1-5"     # 23:00 ET / 06:00 ישראל – עדכון תוצאות בסוף/סגירת יום
  workflow_dispatch:
    inputs:
      mode:
        description: "universe | alerts | full | update"
        required: false
        default: "full"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: database/database.db
          key: days-bot-db-${{ github.run_id }}
          restore-keys: |
            days-bot-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # הרצת סריקת הבוקר (מופעל בלו"ז הבוקר או בהרצה ידנית)
      - name: Run Morning Scan
        if: github.event.schedule == '30 12 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'update')
        run: python main.py full
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:   ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}

      # הרצת עדכון תוצאות המסחר (מופעל בלו"ז הערב או בהרצה ידנית של מצב update)
      - name: Run Evening Update
        if: github.event.schedule == '0 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'update')
        run: python update_trades.py
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          POLYGON_API_KEY:   ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload trade history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-history
          path: data/trades_history.json

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/database.db
          key: days-bot-db-${{ github.run_id }}
