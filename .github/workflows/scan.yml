name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:

  # ============================================================
  # 10 premarket runs — EDT (UTC-4)
  #
  # IMPORTANT:
  # These UTC times are correct for EDT.
  # In EST they will occur one hour earlier in ET.
  # All slots remain safely inside the premarket window.
  # ============================================================
  schedule:
    - cron: '7 9 * * 1-5'     # 05:07 ET
    - cron: '37 9 * * 1-5'    # 05:37 ET
    - cron: '7 10 * * 1-5'    # 06:07 ET
    - cron: '37 10 * * 1-5'   # 06:37 ET
    - cron: '7 11 * * 1-5'    # 07:07 ET
    - cron: '37 11 * * 1-5'   # 07:37 ET
    - cron: '7 12 * * 1-5'    # 08:07 ET
    - cron: '37 12 * * 1-5'   # 08:37 ET
    - cron: '7 13 * * 1-5'    # 09:07 ET
    - cron: '17 13 * * 1-5'   # 09:17 ET

permissions:
  contents: read
  actions: read

# Prevent two scans from modifying/restoring the same DB simultaneously.
# Do NOT cancel the previous run — queue it instead.
concurrency:
  group: days-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Python
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ============================================================
      # Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # Prepare data directory
      # ============================================================
      - name: Prepare data directory
        run: |
          mkdir -p data

      # ============================================================
      # Determine scan date in America/New_York
      # ============================================================
      - name: Determine scan date
        id: date
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          NOW_ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')

          echo "today=$TODAY_ET" >> "$GITHUB_OUTPUT"

          echo "=================================================="
          echo "DAYS-BOT V5.0.6 SCAN"
          echo "GitHub run: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Event: ${{ github.event_name }}"
          echo "ET time: $NOW_ET"
          echo "Scan date: $TODAY_ET"
          echo "=================================================="

      # ============================================================
      # Restore previous SAME-DAY DB
      #
      # IMPORTANT:
      # We look for the most recent successful scan workflow
      # whose run_started_at belongs to TODAY in America/New_York.
      #
      # This avoids accidentally restoring yesterday's DB.
      # ============================================================
      - name: Find previous same-day scan artifact
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY_ET: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail

          echo "Looking for previous successful scan run for ET date: $TODAY_ET"

          PREV_RUN=""

          while IFS=$'\t' read -r RUN_ID RUN_STARTED_AT RUN_NUMBER; do

            # Never use the current run.
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then
              continue
            fi

            RUN_DATE_ET=$(TZ=America/New_York date -d "$RUN_STARTED_AT" +%Y-%m-%d)

            echo "Candidate run=$RUN_ID number=$RUN_NUMBER started=$RUN_STARTED_AT ET_date=$RUN_DATE_ET"

            if [ "$RUN_DATE_ET" = "$TODAY_ET" ]; then
              PREV_RUN="$RUN_ID"
              PREV_RUN_NUMBER="$RUN_NUMBER"
              break
            fi

          done < <(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=100&status=success" \
              --jq '.workflow_runs[] | [.id, .run_started_at, .run_number] | @tsv'
          )

          if [ -z "${PREV_RUN:-}" ]; then
            echo "[restore] No previous successful scan run found for $TODAY_ET"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[restore] Previous same-day run:"
          echo "  run_id=$PREV_RUN"
          echo "  run_number=$PREV_RUN_NUMBER"

          # Artifact name generated by this workflow.
          EXPECTED_ARTIFACT="scan-${TODAY_ET}-r${PREV_RUN_NUMBER}"

          echo "[restore] Looking for artifact: $EXPECTED_ARTIFACT"

          ARTIFACT_EXISTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/$PREV_RUN/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name == \"$EXPECTED_ARTIFACT\") and (.expired == false)] | length")

          if [ "$ARTIFACT_EXISTS" -eq 0 ]; then
            echo "[restore] Expected artifact not found: $EXPECTED_ARTIFACT"
            echo "[restore] Starting with fresh DB"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[restore] Artifact found: $EXPECTED_ARTIFACT"

          echo "has_prev=true" >> "$GITHUB_OUTPUT"
          echo "prev_run=$PREV_RUN" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$EXPECTED_ARTIFACT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Download previous artifact
      # ============================================================
      - name: Download previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          run-id: ${{ steps.restore.outputs.prev_run }}
          path: /tmp/prev/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Restore DB
      # ============================================================
      - name: Restore DB from previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          set -euo pipefail

          echo "=== Previous artifact contents ==="
          find /tmp/prev -maxdepth 4 -type f -print || true

          DB_PATH=""

          if [ -f "/tmp/prev/alerts.db" ]; then
            DB_PATH="/tmp/prev/alerts.db"
          elif [ -f "/tmp/prev/data/alerts.db" ]; then
            DB_PATH="/tmp/prev/data/alerts.db"
          fi

          if [ -z "$DB_PATH" ]; then
            echo "ERROR: alerts.db not found in previous artifact"
            exit 1
          fi

          cp "$DB_PATH" data/alerts.db

          echo "[restore] DB restored:"
          ls -lh data/alerts.db

      # ============================================================
      # Run scanner
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail

          echo "Running DAYS-BOT V5.0.6 scanner..."

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      # ============================================================
      # DB Integrity Check
      # ============================================================
      - name: DB Integrity Check
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import json
          import sys
          import os

          db_path = "data/alerts.db"

          if not os.path.exists(db_path):
              print("ERROR: DB not found")
              sys.exit(1)

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()

          print()
          print("=" * 74)
          print("DB INTEGRITY CHECK (V5.0.6)")
          print("=" * 74)

          row = cur.execute(
              "SELECT DISTINCT scan_date "
              "FROM alerts "
              "ORDER BY scan_date DESC "
              "LIMIT 1"
          ).fetchone()

          if not row:
              print("WARNING: alerts table contains no rows")
              conn.close()
              sys.exit(0)

          scan_date = row["scan_date"]

          print(f"Checking latest alerts.scan_date = {scan_date}")

          mismatches = 0

          for r in cur.execute(
              """
              SELECT ticker, composite_score, raw_candidate_json
              FROM alerts
              WHERE scan_date = ?
              ORDER BY id DESC
              """,
              (scan_date,)
          ):
              ticker = r["ticker"]
              db_c = r["composite_score"]
              raw_json = r["raw_candidate_json"]

              if not raw_json:
                  continue

              try:
                  raw = json.loads(raw_json)
              except Exception:
                  mismatches += 1
                  print(f"  INVALID RAW JSON: {ticker}")
                  continue

              raw_c = raw.get("composite_score")

              if db_c is not None and raw_c is not None:
                  try:
                      if abs(float(db_c) - float(raw_c)) >= 0.01:
                          print(
                              f"  MISMATCH {ticker}: "
                              f"DB={db_c} RAW={raw_c}"
                          )
                          mismatches += 1
                  except Exception:
                      mismatches += 1
                      print(f"  SCORE PARSE ERROR: {ticker}")

          print(f"MISMATCHES: {mismatches}")
          print("=" * 74)

          conn.close()

          if mismatches > 0:
              print(f"FAIL: {mismatches} mismatch(es)")
              sys.exit(1)

          print("PASS: DB matches RAW JSON")
          PYEOF

      # ============================================================
      # Verify PM bars JSON
      # ============================================================
      - name: Verify PM bars JSON
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import json
          import os

          db_path = "data/alerts.db"

          if not os.path.exists(db_path):
              print("DB not found — skipping PM verification")
              raise SystemExit(0)

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row
          cur = conn.cursor()

          try:
              row = cur.execute(
                  "SELECT DISTINCT scan_date "
                  "FROM alerts "
                  "ORDER BY scan_date DESC "
                  "LIMIT 1"
              ).fetchone()
          except Exception as exc:
              print(f"Could not query alerts table: {exc}")
              conn.close()
              raise SystemExit(0)

          if not row:
              print("No alert rows — skipping PM verification")
              conn.close()
              raise SystemExit(0)

          scan_date = row["scan_date"]

          print()
          print("=" * 74)
          print(f"PM BARS JSON VERIFICATION — {scan_date}")
          print("=" * 74)

          mismatch = 0

          for r in cur.execute(
              """
              SELECT ticker, pm_bars, pm_bars_json
              FROM alerts
              WHERE scan_date = ?
              ORDER BY id DESC
              """,
              (scan_date,)
          ):
              ticker = r["ticker"]
              pm_bars = r["pm_bars"] or 0
              raw = r["pm_bars_json"]

              if raw is None:
                  json_count = 0
              else:
                  try:
                      json_count = len(json.loads(raw))
                  except Exception:
                      json_count = -1

              status = "OK" if pm_bars == json_count else "MISMATCH"

              if status == "MISMATCH":
                  mismatch += 1

              print(
                  f"  {ticker:8s} | "
                  f"pm_bars={pm_bars:>3} | "
                  f"json={json_count:>3} | "
                  f"{status}"
              )

          print("=" * 74)
          print(f"PM BAR MISMATCHES: {mismatch}")

          conn.close()

          # This remains diagnostic in V5.0.6.
          # Do not turn PM data issues into strategy changes.
          PYEOF

      # ============================================================
      # Verify V5.0.6 Schema
      # ============================================================
      - name: Verify V5.0.6 Schema
        if: always()
        run: |
          python3 << 'PYEOF'
          import sqlite3
          import os

          db_path = "data/alerts.db"

          if not os.path.exists(db_path):
              print("DB not found — skipping schema verification")
              raise SystemExit(0)

          conn = sqlite3.connect(db_path)
          cur = conn.cursor()

          print()
          print("=" * 74)
          print("V5.0.6 SCHEMA VERIFICATION")
          print("=" * 74)

          required = [
              ("snapshots", "pm_bars_json"),
              ("trigger_results", "trigger_data_mode"),
              ("outcomes", "trigger_result_id"),
          ]

          missing = 0

          for table, col in required:
              cur.execute(f"PRAGMA table_info({table})")
              cols = {row[1] for row in cur.fetchall()}

              present = col in cols

              print(
                  f"  {table:20s}.{col:25s} : "
                  f"{'present' if present else 'MISSING'}"
              )

              if not present:
                  missing += 1

          print()

          for table in ("snapshots", "trigger_results", "outcomes"):
              try:
                  n = cur.execute(
                      f"SELECT COUNT(*) FROM {table}"
                  ).fetchone()[0]
              except Exception:
                  n = "ERROR"

              print(f"  {table:20s} rows: {n}")

          print("=" * 74)

          conn.close()

          if missing:
              print(f"WARNING: {missing} required schema field(s) missing")
          else:
              print("PASS: Required V5.0.6 schema fields present")
          PYEOF

      # ============================================================
      # Final DB presence check
      # ============================================================
      - name: Verify final DB exists
        if: always()
        run: |
          if [ ! -f "data/alerts.db" ]; then
            echo "ERROR: final data/alerts.db does not exist"
            exit 1
          fi

          echo "Final DB:"
          ls -lh data/alerts.db

      # ============================================================
      # Upload daily scan artifact
      #
      # Each run gets its own immutable GitHub artifact.
      # The DB itself is cumulative because it was restored from
      # the previous same-day artifact before the scan.
      # ============================================================
      - name: Upload daily artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.date.outputs.today }}-r${{ github.run_number }}
          path: data/
          retention-days: 30
          if-no-files-found: warn