name: DAYS-BOT V5.0.4 Trading Scanner

on:
  schedule:
    - cron: "45 12 * * 1-5"   # 08:45 ET
    - cron: "0 13 * * 1-5"    # 09:00 ET
    - cron: "15 13 * * 1-5"   # 09:15 ET
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: mkdir -p data

      - name: Show Runtime Information
        run: |
          echo "=============================================="
          echo "DAYS-BOT V5.0.4 – TRADING SCANNER"
          echo "=============================================="
          echo "UTC:"
          date -u
          echo ""
          echo "New York (ET):"
          TZ=America/New_York date
          echo ""
          echo "Event name: ${{ github.event_name }}"
          echo "=============================================="

      - name: Run V5.0.4 Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[Workflow] Manual execution"
            python main.py fullscan_v34 --manual
          else
            echo "[Workflow] Scheduled execution"
            python main.py fullscan_v34
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alerts-db-v5-${{ github.run_number }}
          path: data/alerts.db
          retention-days: 30
