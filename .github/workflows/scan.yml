name: DAYS-BOT

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 08:00 ET
    - cron: '15 12 * * 1-5'  # 08:15 ET
    - cron: '30 12 * * 1-5'  # 08:30 ET
    - cron: '45 12 * * 1-5'  # 08:45 ET
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Run scan (watchlist mode)
        run: python main.py scan
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: data/alerts.db

  entry:
    runs-on: ubuntu-latest
    needs: scan
    if: github.event.schedule == '0 13 * * 1-5' || github.event_name == 'workflow_dispatch'   # 09:00 ET
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: alerts-db-${{ github.run_id }}-*
          path: data/
          merge-multiple: true
      - name: Run entry (trades)
        run: python main.py entry
      - name: Upload final DB
        uses: actions/upload-artifact@v4
        with:
          name: final-trades-db-${{ github.run_id }}
          path: data/alerts.db

  monitor:
    runs-on: ubuntu-latest
    needs: entry
    if: github.event.schedule == '*/5 13-20 * * 1-5' || github.event_name == 'workflow_dispatch'   # כל 5 דקות 09:00-16:00 ET
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest DB
        uses: actions/download-artifact@v4
        with:
          pattern: final-trades-db-${{ github.run_id }}
          path: data/
          merge-multiple: true
      - name: Run monitor
        run: python trade_monitor.py
      - name: Upload updated DB
        uses: actions/upload-artifact@v4
        with:
          name: updated-trades-db-${{ github.run_id }}
          path: data/alerts.db
