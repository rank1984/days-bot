name: DAYS-BOT V5.0.6 Trading Scanner

on:
  schedule:
    # UTC. 08:00–13:30 UTC ≈ 04:00–09:30 ET (EDT)
    # בחורף (EST) שנה ל: '*/30 9-14 * * 1-5'
    - cron: '*/30 8-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 0. זמן + חישוב IN_PM_WINDOW + IS_SCHEDULED ----------
      - name: Compute time env
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

          # IN_PM_WINDOW: 04:00–09:30 ET
          HOUR=$(TZ=America/New_York date +%H)
          MIN=$(TZ=America/New_York date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$NOW_MIN" -ge 240 ] && [ "$NOW_MIN" -lt 570 ]; then
            echo "IN_PM_WINDOW=1" >> $GITHUB_ENV
            echo "PM window: IN ($HOUR:$MIN ET)"
          else
            echo "IN_PM_WINDOW=0" >> $GITHUB_ENV
            echo "PM window: OUT ($HOUR:$MIN ET)"
          fi

          # IS_SCHEDULED: schedule vs workflow_dispatch
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.6.5 SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "Branch:     ${{ github.ref_name }}"
            echo "UTC:        $(date -u +%FT%TZ)"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "Israel:     $(TZ=Asia/Jerusalem date '+%F %T %Z')"
            echo "Scan date:  $TODAY_ET"
            echo "=================================================="
          } | tee scan.log

      # ---------- 1. Checkout + Python ----------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- 1b. זהה entry point ----------
      - name: Locate scanner entry point
        id: entry
        run: |
          for f in main.py scan.py app.py bot.py scanner.py days_bot.py run_scan.py \
                   scripts/main.py scripts/scan.py scripts/run_scan.py src/main.py src/scan.py; do
            if [ -f "$f" ]; then
              echo "entry=$f" >> $GITHUB_OUTPUT
              echo "FOUND entry point: $f"
              exit 0
            fi
          done
          echo "ERROR: no scanner entry point found."
          ls -la
          ls -la scripts/ 2>/dev/null || true
          exit 1

      # ---------- 2. מצא ריצה קודמת עם ארטיפקט ----------
      - name: Find previous run with valid artifact
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for the most recent successful run with a valid artifact ..."

          WF_REF="${{ github.workflow_ref }}"
          WF_PATH="${WF_REF%@*}"
          WF_FILE="${WF_PATH##*/}"
          echo "workflow file: $WF_FILE"

          PREV=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=20" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"completed\" and .conclusion==\"success\") | .id" \
            2>/dev/null | head -n 1 || true)

          if [ -z "$PREV" ]; then
            echo "No previous successful run — starting fresh."
            echo "artifact=" >> $GITHUB_OUTPUT
            echo "run="      >> $GITHUB_OUTPUT
            exit 0
          fi

          ART=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$PREV/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("scan-")) | .name' \
            2>/dev/null | head -n 1 || true)

          echo "run=$PREV"     >> $GITHUB_OUTPUT
          echo "artifact=$ART" >> $GITHUB_OUTPUT
          echo "Selected: run=$PREV artifact=$ART"

      # ---------- 2b. הורדת ארטיפקט מ-Run אחר ----------
      - name: Download previous artifact
        if: steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      # ---------- 2c. שחזור מפורש עם בדיקה ----------
      - name: Restore DB and prior summaries
        if: steps.prev.outputs.artifact != ''
        run: |
          set -euo pipefail
          mkdir -p data summaries

          restored_db=0
          restored_csv=0

          if [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
            echo "DB restored: $(ls -l data/alerts.db)"
            restored_db=1
          fi

          if [ -f /tmp/prev/summaries/all_runs.csv ]; then
            cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
            echo "Prior all_runs.csv restored: $(wc -l < summaries/all_runs.csv) lines"
            restored_csv=1
          fi

          if [ "$restored_db" -eq 0 ] && [ "$restored_csv" -eq 0 ]; then
            echo "::error::Artifact '${{ steps.prev.outputs.artifact }}' downloaded but contains neither data/alerts.db nor summaries/all_runs.csv"
            find /tmp/prev -type f | head -20 || echo "(empty)"
            exit 1
          fi

      # ---------- 3. Pre-scan state (עם כותרת קבועה ל-parsing) ----------
      - name: Pre-scan DB state
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if not os.path.exists(p):
              print('Pre-scan DB state:')
              print('  snapshots: 0')
          else:
              print('Pre-scan DB state:')
              con = sqlite3.connect(p)
              cur = con.cursor()
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  try:
                      n = cur.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                      print(f'  {t}: {n}')
                  except Exception as e:
                      print(f'  {t}: ERR {e}')
              con.close()
          "

      # ---------- 4. Metadata + tests + migrations ----------
      - name: Write run metadata
        continue-on-error: true
        run: python3 scripts/write_run_metadata.py || true

      - name: Outcome engine tests
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py || true

      - name: Migrations
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py || true
          python3 scripts/migrate_research_meta.py || true
          python3 scripts/migrate_cost_columns.py || true

      # ---------- 5. Preflight — לוכד exit code אמיתי ----------
      - name: Preflight check
        id: preflight
        continue-on-error: true
        run: |
          set +e
          python3 scripts/preflight.py > preflight.log 2>&1
          PF_EXIT=$?
          cat preflight.log

          if [ "$PF_EXIT" -eq 0 ]; then
            echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV
            echo "preflight_passed=1" >> $GITHUB_OUTPUT
            echo "Preflight OK"
          else
            echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV
            echo "preflight_passed=0" >> $GITHUB_OUTPUT
            echo "::warning::Preflight exited with code $PF_EXIT — day NOT eligible for Event counting"
          fi

      # ---------- 6. Scanner ----------
      - name: Run scanner
        id: scan
        continue-on-error: true
        env:
          # Alpaca
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:      https://paper-api.alpaca.markets
          APCA_API_BASE_URL:    https://paper-api.alpaca.markets

          # ספקי נתונים משניים
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}

          # טלגרם
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ENTRY="${{ steps.entry.outputs.entry }}"
          SUBCOMMAND="fullscan_v34"

          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--manual"
          fi

          echo ">>> running: python3 $ENTRY $SUBCOMMAND $EXTRA"

          for v in ALPACA_API_KEY ALPACA_SECRET_KEY FINNHUB_API_KEY FMP_API_KEY \
                   GEMINI_API_KEY POLYGON_API_KEY TELEGRAM_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!v:-}" ]; then
              echo "  env $v = SET"
            else
              echo "  env $v = (empty)"
            fi
          done

          if python3 "$ENTRY" "$SUBCOMMAND" $EXTRA 2>&1 | tee -a scan.log; then
            echo "scanner_exit=0" >> $GITHUB_OUTPUT
          else
            EXIT_CODE=$?
            echo "scanner_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
            echo "::warning::Scanner exited with code $EXIT_CODE"
          fi

      # ---------- 6b. הצג לוג אם הסורק נכשל ----------
      - name: Show scanner log on failure
        if: always() && steps.scan.outputs.scanner_exit != '0'
        run: |
          echo "===== SCANNER FAILED (exit=${{ steps.scan.outputs.scanner_exit }}) ====="
          tail -80 scan.log || echo "(no scan.log)"

      # ---------- 6c. בדיקת איכות discovery ----------
      - name: Validate discovery produced snapshots
        if: always()
        run: |
          if grep -q "snapshots_received': 0" scan.log 2>/dev/null; then
            echo "::error::Discovery returned 0 snapshots — credentials missing or API failure. Not a valid research run."
            exit 1
          fi
          echo "Discovery produced snapshots — OK."

      # ---------- 7. Build run summary ----------
      - name: Build run_summary.json
        if: always()
        env:
          RUN_ID:            ${{ github.run_id }}
          RUN_NUMBER:        ${{ github.run_number }}
          EVENT:             ${{ github.event_name }}
          SCAN_DATE:         ${{ env.TODAY_ET }}
          TIME_ET:           ${{ env.TIME_ET }}
          IS_SCHEDULED:      ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:      ${{ env.IN_PM_WINDOW }}
          PREFLIGHT_PASSED:  ${{ env.PREFLIGHT_PASSED }}
        run: |
          if [ -f scan.log ] && [ -s scan.log ]; then
            python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json
          else
            echo "{}" > run_summary.json
          fi
          echo "----- run_summary.json -----"
          cat run_summary.json || true

      # ---------- 8. Append to all_runs.csv ----------
      - name: Append to all_runs.csv
        if: always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true
          echo "----- all_runs.csv -----"
          cat summaries/all_runs.csv || true

      # ---------- 9. Diagnostics ----------
      - name: Research diagnostics
        if: always()
        continue-on-error: true
        run: python3 scripts/research_diagnostics.py || true

      - name: PM forensics
        if: always()
        continue-on-error: true
        run: python3 scripts/pm_forensics.py || true

      # ---------- 10. Upload ----------
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload daily aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
