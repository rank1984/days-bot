name: DAYS-BOT V5.0.6 Trading Scanner

on:
  # כיבינו את ה-schedule של GitHub כי הוא לא אמין.
  # התזמון יופעל ע"י cron-job.org חיצוני דרך workflow_dispatch.
  workflow_dispatch:
    inputs:
      is_cron:
        description: 'Triggered by external cron'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Compute time env
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

          HOUR=$(TZ=America/New_York date +%H)
          MIN=$(TZ=America/New_York date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$NOW_MIN" -ge 240 ] && [ "$NOW_MIN" -lt 570 ]; then
            echo "IN_PM_WINDOW=1" >> $GITHUB_ENV
            echo "PM window: IN ($HOUR:$MIN ET)"
          else
            echo "IN_PM_WINDOW=0" >> $GITHUB_ENV
            echo "PM window: OUT ($HOUR:$MIN ET)"
          fi

          # זיהוי האם זו ריצת מחקר אוטומטית
          if [ "${{ github.event.inputs.is_cron }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.6.5 SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "Branch:     ${{ github.ref_name }}"
            echo "UTC:        $(date -u +%FT%TZ)"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "Israel:     $(TZ=Asia/Jerusalem date '+%F %T %Z')"
            echo "Scan date:  $TODAY_ET"
            echo "=================================================="
          } | tee scan.log

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Locate scanner entry point
        id: entry
        run: |
          for f in main.py scan.py app.py bot.py scanner.py days_bot.py run_scan.py \
                   scripts/main.py scripts/scan.py scripts/run_scan.py src/main.py src/scan.py; do
            if [ -f "$f" ]; then
              echo "entry=$f" >> $GITHUB_OUTPUT
              echo "FOUND entry point: $f"
              exit 0
            fi
          done
          echo "ERROR: no scanner entry point found."
          exit 1

      # --- המשך השלבים בדיוק כמו שהיו (שחזור DB, Preflight, סורק וכו') ---
      # (השארתי את כולם כפי שהם בקובץ הקודם, רק בלי ה-schedule)
      
      - name: Find previous run with valid scan artifact
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WF_FILE="scan.yml"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed" and .conclusion=="success") | .id' 2>/dev/null || echo "")
          FOUND_RUN=""
          FOUND_ART=""
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("scan-")) | select(.size_in_bytes > 0) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then
              FOUND_RUN="$RID"
              FOUND_ART="$ART"
              break
            fi
          done
          if [ -z "$FOUND_RUN" ]; then
            echo "artifact=" >> $GITHUB_OUTPUT
            echo "run="      >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "run=$FOUND_RUN"     >> $GITHUB_OUTPUT
          echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT

      - name: Download previous artifact
        if: steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB and prior summaries
        if: steps.prev.outputs.artifact != ''
        run: |
          mkdir -p data summaries
          [ -f /tmp/prev/data/alerts.db ] && cp /tmp/prev/data/alerts.db data/alerts.db && echo "DB restored"
          [ -f /tmp/prev/summaries/all_runs.csv ] && cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv && echo "CSV restored"

      - name: Pre-scan DB state
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if os.path.exists(p):
              con = sqlite3.connect(p)
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  print(f'  {t}: {con.execute(f\"SELECT COUNT(*) FROM {t}\").fetchone()[0]}')
              con.close()
          " 2>&1 | tee -a scan.log

      - name: Write run metadata
        continue-on-error: true
        run: python3 scripts/write_run_metadata.py || true

      - name: Outcome engine tests
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py || true

      - name: Migrations
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py || true
          python3 scripts/migrate_research_meta.py || true
          python3 scripts/migrate_cost_columns.py || true

      - name: Preflight check
        id: preflight
        continue-on-error: true
        run: |
          set +e
          python3 scripts/preflight.py > preflight.log 2>&1
          PF_EXIT=$?
          cat preflight.log
          if [ "$PF_EXIT" -eq 0 ]; then
            echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV
          else
            echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV
          fi

      - name: Run scanner
        id: scan
        continue-on-error: true
        env:
          RESEARCH_MODE:        "true"
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:      https://paper-api.alpaca.markets
          APCA_API_BASE_URL:    https://paper-api.alpaca.markets
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ENTRY="${{ steps.entry.outputs.entry }}"
          EXTRA=""
          if [ "${{ github.event.inputs.is_cron }}" != "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--manual"
          fi
          python3 "$ENTRY" fullscan_v34 $EXTRA 2>&1 | tee -a scan.log

      - name: Validate discovery produced snapshots
        if: always()
        run: |
          if grep -q "snapshots_received': 0" scan.log 2>/dev/null; then
            echo "::error::Discovery returned 0 snapshots."
            exit 1
          fi
          echo "Discovery OK."

      - name: Build run_summary.json
        if: always()
        env:
          RUN_ID:            ${{ github.run_id }}
          RUN_NUMBER:        ${{ github.run_number }}
          EVENT:             ${{ github.event_name }}
          SCAN_DATE:         ${{ env.TODAY_ET }}
          TIME_ET:           ${{ env.TIME_ET }}
          IS_SCHEDULED:      ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:      ${{ env.IN_PM_WINDOW }}
          PREFLIGHT_PASSED:  ${{ env.PREFLIGHT_PASSED }}
        run: |
          if [ -f scan.log ] && [ -s scan.log ]; then
            python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json
          else
            echo "{}" > run_summary.json
          fi

      - name: Append to all_runs.csv
        if: always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true

      - name: Research diagnostics
        if: always()
        continue-on-error: true
        run: python3 scripts/research_diagnostics.py || true

      - name: PM forensics
        if: always()
        continue-on-error: true
        run: python3 scripts/pm_forensics.py || true

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          retention-days: 14

      - name: Upload daily aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          retention-days: 30
          overwrite: true
