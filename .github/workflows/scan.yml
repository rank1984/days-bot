name: DAYS-BOT V5.0.7 Swing Scanner

on:
  # UTC. 13:30 UTC = 09:30 ET (פתיחת השוק)
  # UTC. 20:30 UTC = 16:30 ET (סגירת השוק)
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 0. זמן + חישוב משתני סביבה ----------
      - name: Compute time env
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

          HOUR=$(TZ=America/New_York date +%H)
          MIN=$(TZ=America/New_York date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MIN))
          # חלון מסחר RTH
          if [ "$NOW_MIN" -ge 570 ] && [ "$NOW_MIN" -lt 960 ]; then
            echo "IN_PM_WINDOW=1" >> $GITHUB_ENV
            echo "PM window: IN ($HOUR:$MIN ET)"
          else
            echo "IN_PM_WINDOW=0" >> $GITHUB_ENV
            echo "PM window: OUT ($HOUR:$MIN ET)"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.7 SWING SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "UTC:        $(date -u +%FT%TZ)"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "=================================================="
          } | tee scan.log

      # ---------- 1. Checkout + Python ----------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Locate scanner entry point
        id: entry
        run: |
          for f in main.py scan.py app.py; do
            if [ -f "$f" ]; then
              echo "entry=$f" >> $GITHUB_OUTPUT
              echo "FOUND entry point: $f"
              exit 0
            fi
          done
          exit 1

      # ---------- 2. שחזור DB ----------
      - name: Find previous run with valid scan artifact
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WF_REF="${{ github.workflow_ref }}"
          WF_PATH="${WF_REF%@*}"
          WF_FILE="${WF_PATH##*/}"

          RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=10" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed" and .conclusion=="success") | .id' \
            2>/dev/null || echo "")

          FOUND_RUN=""
          FOUND_ART=""
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("scan-")) | select(.size_in_bytes > 0) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
          done

          if [ -n "$FOUND_RUN" ]; then
            echo "run=$FOUND_RUN"     >> $GITHUB_OUTPUT
            echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT
          else
            echo "run="      >> $GITHUB_OUTPUT
            echo "artifact=" >> $GITHUB_OUTPUT
          fi

      - name: Download previous artifact
        if: steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB
        if: steps.prev.outputs.artifact != ''
        run: |
          mkdir -p data summaries
          [ -f /tmp/prev/data/alerts.db ] && cp /tmp/prev/data/alerts.db data/alerts.db
          [ -f /tmp/prev/summaries/all_runs.csv ] && cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
          echo "Restored DB and CSV."

      # ---------- 3. בדיקות מקדימות ----------
      - name: Pre-scan DB state
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if os.path.exists(p):
              con = sqlite3.connect(p)
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  try: print(f'  {t}: {con.execute(f\"SELECT COUNT(*) FROM {t}\").fetchone()[0]}')
                  except: pass
              con.close()
          " 2>&1 | tee -a scan.log

      - name: Outcome engine tests
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py || true

      - name: Migrations
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py || true
          python3 scripts/migrate_research_meta.py || true
          python3 scripts/migrate_cost_columns.py || true

      - name: Preflight check
        id: preflight
        continue-on-error: true
        run: |
          set +e
          python3 scripts/preflight.py > preflight.log 2>&1
          PF_EXIT=$?
          cat preflight.log
          if [ "$PF_EXIT" -eq 0 ]; then
            echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV
          else
            echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV
          fi

      # ---------- 4. הרצת הסורק (Swing Mode) ----------
      - name: Run scanner
        id: scan
        continue-on-error: true
        env:
          RESEARCH_MODE:        "true"
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ENTRY="${{ steps.entry.outputs.entry }}"
          SUBCOMMAND="swing_v1"   # <--- שונה ל-Swing
          
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--manual"
          fi

          echo ">>> running: python3 $ENTRY $SUBCOMMAND $EXTRA"
          python3 "$ENTRY" "$SUBCOMMAND" $EXTRA 2>&1 | tee -a scan.log

      # ---------- 5. סיכום ושמירה ----------
      - name: Validate discovery produced snapshots
        if: always()
        run: |
          if grep -q "snapshots_received': 0" scan.log 2>/dev/null; then
            echo "::error::Discovery returned 0 snapshots."
            exit 1
          fi

      - name: Build run_summary.json
        if: always()
        env:
          RUN_ID:            ${{ github.run_id }}
          RUN_NUMBER:        ${{ github.run_number }}
          EVENT:             ${{ github.event_name }}
          SCAN_DATE:         ${{ env.TODAY_ET }}
          TIME_ET:           ${{ env.TIME_ET }}
          IS_SCHEDULED:      ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:      ${{ env.IN_PM_WINDOW }}
          PREFLIGHT_PASSED:  ${{ env.PREFLIGHT_PASSED }}
        run: |
          if [ -f scan.log ] && [ -s scan.log ]; then
            python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json
          else
            echo "{}" > run_summary.json
          fi

      - name: Append to all_runs.csv
        if: always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true

      # ---------- 6. העלאה ----------
      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          retention-days: 14

      - name: Upload daily aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          retention-days: 30
          overwrite: true
