name: DAYS-BOT V5.0.7 Swing Scanner

on:
  # UTC. 
  # 14:30 UTC = 10:30 ET (התייצבות הבוקר)
  # 20:30 UTC = 16:30 ET (סגירת השוק - הנתון הקובע)
  schedule:
    - cron: '30 14 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run (skip dedup)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- Dedup: מונע ריצה כפולה באותו חלון זמן ----------
      - name: Dedup check
        id: dedup
        if: github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          HOUR_ET=$(TZ=America/New_York date +%H)
          
          # מחלקים את היום לשניים: בוקר (לפני 15:00 ET) וסגירה (אחרי 15:00 ET)
          if [ "$HOUR_ET" -lt 15 ]; then
            WINDOW="MORNING"
          else
            WINDOW="CLOSE"
          fi

          # בודק אם כבר רצה בהצלחה ריצה בחלון הזה היום
          COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status == \"completed\" and .conclusion == \"success\") | select(.created_at | startswith(\"$TODAY_ET\"))] | length" \
            2>/dev/null || echo "0")

          # לוגיקה פשוטה: אם רצנו היום יותר מפעם אחת (למשל הבוקר), והגענו לסגירה - נדרוס?
          # בואו נעשה פשוט: אם יש ריצה מוצלחת היום והיא הייתה אחרי 20:00 UTC, תדלג.
          
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -ge 20 ]; then
             # ריצת סגירה - בודקים אם כבר היתה ריצת סגירה
             CLOSE_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=20" \
               --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY_ET\")) | select(.created_at | contains(\"T20:\"))] | length" 2>/dev/null || echo "0")
             if [ "$CLOSE_RUNS" -ge 1 ]; then
               echo "skip=true" >> $GITHUB_OUTPUT
               echo "Dedup: Close run already done today."
               exit 0
             fi
          else
             # ריצת בוקר - בודקים אם כבר היתה ריצת בוקר
             MORNING_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=20" \
               --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY_ET\")) | select(.created_at | contains(\"T14:\") or contains(\"T15:\"))] | length" 2>/dev/null || echo "0")
             if [ "$MORNING_RUNS" -ge 1 ]; then
               echo "skip=true" >> $GITHUB_OUTPUT
               echo "Dedup: Morning run already done today."
               exit 0
             fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Dedup: Proceeding."

      # ---------- 0. זמן + חישוב משתני סביבה ----------
      - name: Compute time env
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

          HOUR=$(TZ=America/New_York date +%H)
          MIN=$(TZ=America/New_York date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$NOW_MIN" -ge 570 ] && [ "$NOW_MIN" -lt 960 ]; then
            echo "IN_PM_WINDOW=1" >> $GITHUB_ENV
          else
            echo "IN_PM_WINDOW=0" >> $GITHUB_ENV
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        if: steps.dedup.outputs.skip != 'true'
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.7 SWING SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Force:      ${{ github.event.inputs.force }}"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "=================================================="
          } | tee scan.log

      # ---------- 1. Checkout + Python ----------
      - uses: actions/checkout@v4
        if: steps.dedup.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Locate scanner entry point
        id: entry
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "entry=main.py" >> $GITHUB_OUTPUT

      # ---------- 2. שחזור DB ----------
      - name: Find previous run with valid scan artifact
        id: prev
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WF_FILE="scan.yml"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=10" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed" and .conclusion=="success") | .id' 2>/dev/null || echo "")
          FOUND_RUN=""; FOUND_ART=""
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("scan-")) | select(.size_in_bytes > 0) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
          done
          if [ -n "$FOUND_RUN" ]; then echo "run=$FOUND_RUN" >> $GITHUB_OUTPUT; echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT; fi

      - name: Download previous artifact
        if: steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB
        if: steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != ''
        run: |
          mkdir -p data summaries
          [ -f /tmp/prev/data/alerts.db ] && cp /tmp/prev/data/alerts.db data/alerts.db
          [ -f /tmp/prev/summaries/all_runs.csv ] && cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv

      # ---------- 3. בדיקות מקדימות ----------
      - name: Pre-scan DB state
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if os.path.exists(p):
              con = sqlite3.connect(p)
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  try: print(f'  {t}: {con.execute(f\"SELECT COUNT(*) FROM {t}\").fetchone()[0]}')
                  except: pass
              con.close()
          " 2>&1 | tee -a scan.log

      - name: Outcome engine tests
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py || true

      - name: Migrations
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py || true
          python3 scripts/migrate_research_meta.py || true
          python3 scripts/migrate_cost_columns.py || true

      - name: Preflight check
        id: preflight
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set +e
          python3 scripts/preflight.py > preflight.log 2>&1
          cat preflight.log
          if [ $? -eq 0 ]; then echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV; else echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV; fi

      # ---------- 4. הרצת הסורק ----------
      - name: Run scanner
        id: scan
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        env:
          RESEARCH_MODE:        "true"
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          echo ">>> running: python3 main.py swing_v1 --manual"
          python3 main.py swing_v1 --manual 2>&1 | tee -a scan.log

      # ---------- 5. סיכום ושמירה ----------
      - name: Build run_summary.json
        if: steps.dedup.outputs.skip != 'true' && always()
        env:
          RUN_ID:            ${{ github.run_id }}
          RUN_NUMBER:        ${{ github.run_number }}
          EVENT:             ${{ github.event_name }}
          SCAN_DATE:         ${{ env.TODAY_ET }}
          TIME_ET:           ${{ env.TIME_ET }}
          IS_SCHEDULED:      ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:      ${{ env.IN_PM_WINDOW }}
          PREFLIGHT_PASSED:  ${{ env.PREFLIGHT_PASSED }}
        run: |
          python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json

      - name: Append to all_runs.csv
        if: steps.dedup.outputs.skip != 'true' && always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true

      # ---------- 6. העלאה ----------
      - name: Upload scan artifact
        if: steps.dedup.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          retention-days: 14

      - name: Upload daily aggregate
        if: steps.dedup.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          retention-days: 30
          overwrite: true
