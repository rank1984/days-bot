name: DAYS-BOT V5.0.6 Trading Scanner

on:
  workflow_dispatch:
    inputs:
      run_evaluator:
        description: 'Run evaluator after scan?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_evaluator:
        description: 'Force evaluator (delete existing outcomes + triggers)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  schedule:
    # Target PM window: 04:00-09:30 ET (11:00-16:30 IDT).
    # GitHub Actions delays scheduled jobs by 0-8h depending on load.
    - cron: '02 0 * * 1-5'
    - cron: '32 0 * * 1-5'
    - cron: '02 1 * * 1-5'
    - cron: '32 1 * * 1-5'
    - cron: '02 2 * * 1-5'
    - cron: '32 2 * * 1-5'
    - cron: '02 3 * * 1-5'
    - cron: '32 3 * * 1-5'
    - cron: '02 4 * * 1-5'
    - cron: '32 4 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      # ============================================================
      # STEP 1: Determine scan date and PM window
      # ============================================================
      - name: Determine scan date and PM window
        id: date
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          NOW_HHMM=$(TZ=America/New_York date +%H%M)
          NOW_ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          NOW_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          NOW_IL=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M:%S %Z')

          if [ "$NOW_HHMM" -ge "0400" ] && [ "$NOW_HHMM" -lt "0930" ]; then
            IN_PM_WINDOW=true
          else
            IN_PM_WINDOW=false
          fi

          echo "today=$TODAY_ET" >> "$GITHUB_OUTPUT"
          echo "now_utc=$NOW_UTC" >> "$GITHUB_OUTPUT"
          echo "now_hhmm=$NOW_HHMM" >> "$GITHUB_OUTPUT"
          echo "in_pm_window=$IN_PM_WINDOW" >> "$GITHUB_OUTPUT"

          echo "=================================================="
          echo "DAYS-BOT V5.0.6.4 SCAN"
          echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
          echo "Event:      ${{ github.event_name }}"
          echo "Git SHA:    ${{ github.sha }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "UTC:        $NOW_UTC"
          echo "ET:         $NOW_ET"
          echo "Israel:     $NOW_IL"
          echo "Scan date:  $TODAY_ET"
          echo "PM window:  $IN_PM_WINDOW (now=$NOW_HHMM ET)"
          echo "=================================================="

      # ============================================================
      # STEP 2a: DIAGNOSTIC — inspect GitHub API output
      # (helps debug why the wrong run is selected)
      # ============================================================
      - name: Diagnostic — inspect GitHub API runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "=================================================="
          echo "DIAGNOSTIC: First 10 runs (any status)"
          echo "=================================================="
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=10" \
            --jq '.workflow_runs[] | [.id, .run_started_at, .run_number, .status, (.conclusion // "null")] | @tsv' \
            || echo "(failed)"
          echo ""
          echo "=================================================="
          echo "DIAGNOSTIC: First 10 runs (completed + success)"
          echo "=================================================="
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=10&status=completed" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | [.id, .run_started_at, .run_number, .status, .conclusion] | @tsv' \
            || echo "(failed)"
          echo "=================================================="
          exit 0

      # ============================================================
      # STEP 2b: Cumulative DB restore
      #
      # Iterate through the most recent successful runs.
      # For each run, check whether it has a usable scan-* artifact.
      # Use the FIRST run with a valid artifact.
      #
      # Bug fix (07/10): previous logic took the most recent run,
      # and if it had no artifact -> gave up entirely (fresh DB).
      # New logic walks backward until it finds a valid artifact.
      # ============================================================
      - name: Find latest previous artifact (cumulative DB)
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for the most recent successful run with a valid artifact ..."

          PREV_RUN=""
          PREV_RUN_NUMBER=""
          PREV_RUN_STARTED=""
          ARTIFACT_NAME=""

          # Get up to 30 most recent completed runs with conclusion=success
          RUNS_TSV=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=30&status=completed" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | [.id, .run_started_at, .run_number] | @tsv')

          if [ -z "$RUNS_TSV" ]; then
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "No completed+success runs found — starting fresh DB."
            exit 0
          fi

          # Iterate: newest to oldest
          while IFS=$'\t' read -r RUN_ID RUN_STARTED_AT RUN_NUMBER; do
            if [ -z "$RUN_ID" ]; then
              continue
            fi
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then
              echo "  skip current run $RUN_ID"
              continue
            fi

            echo "  checking run #$RUN_NUMBER ($RUN_ID) at $RUN_STARTED_AT ..."

            CANDIDATE_ARTIFACT=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.name | startswith("scan-")) and (.expired == false))] | sort_by(.created_at) | reverse | .[0].name // empty' 2>/dev/null || echo "")

            if [ -n "$CANDIDATE_ARTIFACT" ]; then
              PREV_RUN="$RUN_ID"
              PREV_RUN_NUMBER="$RUN_NUMBER"
              PREV_RUN_STARTED="$RUN_STARTED_AT"
              ARTIFACT_NAME="$CANDIDATE_ARTIFACT"
              echo "  -> found valid artifact: $ARTIFACT_NAME"
              break
            else
              echo "  -> no valid artifact; trying older run"
            fi
          done <<< "$RUNS_TSV"

          if [ -z "$PREV_RUN" ] || [ -z "$ARTIFACT_NAME" ]; then
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "No usable artifact found in the last 30 successful runs — starting fresh DB."
            exit 0
          fi

          echo ""
          echo "Selected:"
          echo "  run=$PREV_RUN (#$PREV_RUN_NUMBER)"
          echo "  started=$PREV_RUN_STARTED"
          echo "  artifact=$ARTIFACT_NAME"

          echo "has_prev=true" >> "$GITHUB_OUTPUT"
          echo "prev_run=$PREV_RUN" >> "$GITHUB_OUTPUT"
          echo "prev_run_number=$PREV_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "prev_run_started=$PREV_RUN_STARTED" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download previous artifact
        if: steps.restore.outputs.has_prev == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          run-id: ${{ steps.restore.outputs.prev_run }}
          path: /tmp/prev/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore DB
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          echo "Restoring DB from artifact: ${{ steps.restore.outputs.artifact_name }}"
          echo "From run: ${{ steps.restore.outputs.prev_run }} (#${{ steps.restore.outputs.prev_run_number }})"

          if [ -f /tmp/prev/alerts.db ]; then
            cp /tmp/prev/alerts.db data/alerts.db
          elif [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
          else
            echo "WARNING: alerts.db not found in artifact"
            find /tmp/prev -type f -maxdepth 3 || true
            echo "Starting with empty DB."
            exit 0
          fi

          echo "DB restored successfully."
          ls -lh data/alerts.db

      - name: DB pre-scan summary
        if: steps.restore.outputs.has_prev == 'true'
        run: |
          python3 -c "
          import sqlite3, os
          p = 'data/alerts.db'
          if not os.path.exists(p):
              print('No DB file'); raise SystemExit
          c = sqlite3.connect(p); cur = c.cursor()
          try:
              print('Pre-scan DB state:')
              print('  snapshots:      ', cur.execute('SELECT COUNT(*) FROM snapshots').fetchone()[0])
              print('  alerts:         ', cur.execute('SELECT COUNT(*) FROM alerts').fetchone()[0])
              print('  outcomes:       ', cur.execute('SELECT COUNT(*) FROM outcomes').fetchone()[0])
              print('  trigger_results:', cur.execute('SELECT COUNT(*) FROM trigger_results').fetchone()[0])
              rows = cur.execute('SELECT MIN(scan_date), MAX(scan_date) FROM snapshots').fetchone()
              print('  scan_date range:', rows[0], '->', rows[1])
          except Exception as e:
              print('  (schema check failed:', e, ')')
          c.close()
          "

      # ============================================================
      # STEP 3: Write run metadata
      # ============================================================
      - name: Write run_metadata.json
        run: python3 scripts/write_run_metadata.py

      # ============================================================
      # STEP 4: Run tests (fail-fast on broken code)
      # ============================================================
      - name: Run outcome engine tests
        run: python3 tests/test_outcome_engine.py

      # ============================================================
      # STEP 5: Migrations (idempotent)
      # ============================================================
      - name: Migrate — ensure event_rank column
        run: python3 scripts/migrate_event_rank.py

      - name: Migrate — ensure research_run metadata columns
        run: python3 scripts/migrate_research_meta.py

      - name: Migrate — ensure cost logging columns
        run: python3 scripts/migrate_cost_columns.py

      # ============================================================
      # STEP 6: Preflight check (5 assertions, non-blocking)
      # ============================================================
      - name: Preflight check
        id: preflight
        if: always()
        continue-on-error: true
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
        run: |
          set +e
          python3 scripts/preflight.py
          EXIT_CODE=$?

          if [ "$EXIT_CODE" = "0" ]; then
            RESEARCH_DAY=true
          else
            RESEARCH_DAY=false
          fi

          echo "preflight_exit=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "research_day=$RESEARCH_DAY" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=================================================="
          if [ "$RESEARCH_DAY" = "true" ]; then
            echo "PREFLIGHT: PASSED (day eligible for Event counting)"
          else
            echo "PREFLIGHT: FAILED (day NOT counted as research day)"
            echo "  Reason: one or more assertions failed. See output above."
            echo "  Note:   scanner will run, but Events from this day"
            echo "          are excluded from the primary sample."
          fi
          echo "=================================================="
          exit 0

      # ============================================================
      # STEP 7: Run scanner
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          RESEARCH_MODE: "true"
          IS_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          IN_PM_WINDOW: ${{ steps.date.outputs.in_pm_window == 'true' && '1' || '0' }}
          PREFLIGHT_PASSED: ${{ steps.preflight.outputs.research_day == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "SCANNER CONTEXT"
          echo "  IS_SCHEDULED:     $IS_SCHEDULED"
          echo "  IN_PM_WINDOW:     $IN_PM_WINDOW"
          echo "  PREFLIGHT_PASSED: $PREFLIGHT_PASSED"
          echo "=================================================="
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py fullscan_v34 --manual
          else
            python main.py fullscan_v34
          fi

      # ============================================================
      # STEP 8: Research diagnostics
      # ============================================================
      - name: Run research diagnostics
        if: always()
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
          IN_PM_WINDOW: ${{ steps.date.outputs.in_pm_window }}
        run: python3 scripts/research_diagnostics.py

      # ============================================================
      # STEP 9: PM forensics
      # ============================================================
      - name: Run PM forensics
        if: always()
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
          IN_PM_WINDOW: ${{ steps.date.outputs.in_pm_window }}
        run: python3 scripts/pm_forensics.py

      # ============================================================
      # STEP 10: Evaluator (optional)
      # ============================================================
      - name: Run evaluator (optional)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_evaluator == 'true'
        env:
          TODAY_ET: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "RUNNING EVALUATOR"
          echo "scan_date:    $TODAY_ET"
          echo "force:        ${{ inputs.force_evaluator }}"
          echo "research_day: ${{ steps.preflight.outputs.research_day }}"
          echo "=================================================="
          if [ "${{ inputs.force_evaluator }}" = "true" ]; then
            python3 evaluate_snapshots.py --scan-date "$TODAY_ET" --force
          else
            python3 evaluate_snapshots.py --scan-date "$TODAY_ET"
          fi

      # ============================================================
      # STEP 11: Cost decomposition (log-only)
      # ============================================================
      - name: Compute cost decomposition (log-only)
        if: always()
        run: python3 scripts/cost_analyzer.py

      # ============================================================
      # STEP 12: Research comparison (log-only)
      # ============================================================
      - name: Research comparison report (log-only)
        if: always()
        run: python3 scripts/research_comparison.py

      # ============================================================
      # STEP 13: Upload daily artifact
      # ============================================================
      - name: Upload daily artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ steps.date.outputs.today }}-r${{ github.run_number }}
          path: data/
          retention-days: 90
          if-no-files-found: warn
          
