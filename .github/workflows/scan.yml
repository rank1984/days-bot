name: DAYS-BOT V3.1 Decision Engine Scanner

on:
  schedule:
    # GitHub Actions uses UTC.
    # 12:00-13:30 UTC = 08:00-09:30 ET (during EDT)
    # This prevents runs after 09:30 ET.
    - cron: "*/15 12 * * 1-5"
    - cron: "0,15,30 13 * * 1-5"

  # Allows manual execution whenever you want.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # DATA DIRECTORY
      # --------------------------------------------------------
      - name: Create Data Directory
        run: |
          mkdir -p data

      # --------------------------------------------------------
      # RUN SCANNER (AUTOMATIC vs MANUAL DETECT)
      # --------------------------------------------------------
      - name: Run DAYS-BOT V3.1 Decision Engine Scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_BASE_URL: https://api.alpaca.markets
        run: |
          echo "=============================================="
          echo "DAYS-BOT V3.1 DECISION ENGINE + TRADE PLAN"
          echo "Automatic / Manual Scanner"
          echo "=============================================="
          date -u

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[Workflow] ⚠️ Manual Dispatch Detected -> Executing with --manual flag"
            python main.py scan --manual
          else
            echo "[Workflow] 🟢 Scheduled Cron Run Detected -> Executing standard scan"
            python main.py scan
          fi

      # --------------------------------------------------------
      # UPLOAD DATABASE / LOGS
      # --------------------------------------------------------
      - name: Upload Experiment Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db-v31-${{ github.run_number }}
          path: |
            data/alerts.db
          if-no-files-found: warn
          retention-days: 30
