name: DAYS-BOT V5.0.8 Swing Scanner

on:
  # GitHub Actions תומך ב-timezone (IANA) ולכן לא צריך לחשב UTC ידנית.
  # הזמנים כאן הם לפי שעון ניו יורק (ET) והם אוטומטיים לקיץ/חורף.
  #
  # ריצת בוקר: 09:00 ET (לפני פתיחת השוק)
  #   - שעון חורף ישראלי (IST): 16:00
  #   - שעון קיץ ישראלי (IDT):  17:00
  #
  # ריצת סגירה: 16:30 ET (אחרי סגירת השוק)
  #   - שעון חורף ישראלי (IST): 23:30
  #   - שעון קיץ ישראלי (IDT):  00:30 (למחרת)
  schedule:
    - cron: '0 9 * * 1-5'
      timezone: "America/New_York"
    - cron: '30 16 * * 1-5'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run (skip dedup)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db
  # מנטרל את שטף אזהרות Pandas4 שמקורו ב-yfinance
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::FutureWarning"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- Dedup: מונע ריצה כפולה בתוך חלון של 120 דקות ----------
      - name: Dedup check
        id: dedup
        if: github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LAST_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/scan.yml/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status == \"completed\" and .conclusion == \"success\")] | .[0] | .updated_at" \
            2>/dev/null || echo "")

          if [ -z "$LAST_RUN" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Dedup: no previous successful run — proceeding"
            exit 0
          fi

          LAST_EPOCH=$(date -d "$LAST_RUN" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          DIFF_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))

          echo "Dedup: last successful run was $DIFF_MIN minutes ago ($LAST_RUN)"

          if [ "$DIFF_MIN" -lt 120 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Dedup: SKIPPING — a successful run was $DIFF_MIN min ago (< 120)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Dedup: PROCEEDING — last successful run was $DIFF_MIN min ago"
          fi

      # ---------- 0. חישוב משתני זמן (לפי ET, אך נשמרים גם עבור התצוגה) ----------
      - name: Compute time env
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

          # מצב Swing אינו תלוי בחלון Pre-Market
          echo "IN_PM_WINDOW=0" >> $GITHUB_ENV

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        if: steps.dedup.outputs.skip != 'true'
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.8 SWING SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Force:      ${{ github.event.inputs.force }}"
            echo "UTC:        $(date -u +%FT%TZ)"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "Israel:     $(TZ=Asia/Jerusalem date '+%F %T %Z')"
            echo "=================================================="
          } | tee scan.log

      # ---------- 1. התקנה ----------
      - uses: actions/checkout@v4
        if: steps.dedup.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- 2. שחזור DB מהריצה הקודמת ----------
      - name: Find previous run with valid scan artifact
        id: prev
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WF_FILE="scan.yml"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=10" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed" and .conclusion=="success") | .id' 2>/dev/null || echo "")
          FOUND_RUN=""; FOUND_ART=""
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("scan-")) | select(.size_in_bytes > 0) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
          done
          if [ -n "$FOUND_RUN" ]; then
            echo "run=$FOUND_RUN" >> $GITHUB_OUTPUT
            echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT
          fi

      - name: Download previous artifact
        if: steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB + prior summary
        if: steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != ''
        run: |
          mkdir -p data summaries
          [ -f /tmp/prev/data/alerts.db ]         && cp /tmp/prev/data/alerts.db         data/alerts.db
          [ -f /tmp/prev/summaries/all_runs.csv ] && cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
          [ -f /tmp/prev/run_summary_prior.json ] && cp /tmp/prev/run_summary_prior.json run_summary_prior.json
          echo "DB restored (if present)."

      - name: Verify DB integrity
        if: steps.dedup.outputs.skip != 'true'
        run: |
          set +e
          if [ ! -f data/alerts.db ]; then
            echo "[integrity] no DB to verify (fresh start)"
            exit 0
          fi
          RESULT=$(sqlite3 data/alerts.db "PRAGMA integrity_check;" 2>&1 | head -n 1)
          if [ "$RESULT" = "ok" ]; then
            echo "[integrity] PRAGMA integrity_check = ok"
          else
            echo "[integrity] WARN: PRAGMA integrity_check = $RESULT"
            echo "[integrity] renaming DB to alerts.db.corrupt and starting fresh"
            mv data/alerts.db data/alerts.db.corrupt
          fi

      # ---------- 3. בדיקות מקדימות ----------
      - name: Pre-scan DB state
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if os.path.exists(p):
              con = sqlite3.connect(p)
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  try: print(f'  {t}: {con.execute(f\"SELECT COUNT(*) FROM {t}\").fetchone()[0]}')
                  except: pass
              con.close()
          " 2>&1 | tee -a scan.log

      - name: Capture PRE-scan snapshot count
        id: pre
        if: steps.dedup.outputs.skip != 'true'
        run: |
          PRE=$(sqlite3 data/alerts.db "SELECT COUNT(*) FROM snapshots;" 2>/dev/null || echo 0)
          echo "PRE_SCAN_COUNT=$PRE" >> $GITHUB_ENV
          echo "PRE_SCAN_COUNT=$PRE" >> $GITHUB_OUTPUT
          echo "[pre] snapshots before scan: $PRE"

      - name: Outcome engine tests
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py || true

      - name: Migrations
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py    || true
          python3 scripts/migrate_research_meta.py || true
          python3 scripts/migrate_cost_columns.py  || true

      # ---------- 4. Preflight (מצב Swing) ----------
      - name: Preflight check
        id: preflight
        if: steps.dedup.outputs.skip != 'true'
        run: |
          set +e
          python3 scripts/preflight.py --mode swing > preflight.log 2>&1
          RC=$?
          cat preflight.log
          if [ $RC -eq 0 ]; then
            echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV
            echo "PREFLIGHT_PASSED=1" >> $GITHUB_OUTPUT
          else
            echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV
            echo "PREFLIGHT_PASSED=0" >> $GITHUB_OUTPUT
          fi
          exit 0

      # ---------- 5. הרצת הסורק ----------
      - name: Run scanner
        id: scan
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        env:
          RESEARCH_MODE:        "true"
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          echo ">>> running: python3 main.py swing_v1 --manual"
          python3 main.py swing_v1 --manual 2>&1 | tee -a scan.log

      # ---------- 6. מטא-דאטה וסיכום ----------
      - name: Write run metadata
        if: steps.dedup.outputs.skip != 'true' && always()
        env:
          PREFLIGHT_PASSED: ${{ env.PREFLIGHT_PASSED }}
          SCAN_DATE:        ${{ env.TODAY_ET }}
          TIME_ET:          ${{ env.TIME_ET }}
          IS_SCHEDULED:     ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:     ${{ env.IN_PM_WINDOW }}
        run: |
          python3 scripts/write_run_metadata.py 2>&1 | tee -a scan.log || true

      - name: Build run_summary.json
        if: steps.dedup.outputs.skip != 'true' && always()
        env:
          PRE_SCAN_COUNT:   ${{ env.PRE_SCAN_COUNT }}
          PREFLIGHT_PASSED: ${{ env.PREFLIGHT_PASSED }}
          SCAN_DATE:        ${{ env.TODAY_ET }}
          TIME_ET:          ${{ env.TIME_ET }}
          IS_SCHEDULED:     ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:     ${{ env.IN_PM_WINDOW }}
        run: |
          python3 scripts/summarize_run.py scan.log run_summary.json \
            || echo '{"error":"summarize_failed"}' > run_summary.json

      - name: Append to all_runs.csv
        if: steps.dedup.outputs.skip != 'true' && always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true

      # ---------- 7. העלאה ----------
      - name: Upload scan artifact
        if: steps.dedup.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            run_summary_prior.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload daily aggregate
        if: steps.dedup.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
