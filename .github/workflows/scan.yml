name: DAYS-BOT V5.0.6 Trading Scanner

on:
  schedule:
    - cron: '*/30 4-11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------- 0. זמן + באנר (כותב ל-scan.log) ----------
      - name: Compute TODAY_ET
        run: echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Banner
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.6.5 SCAN"
            echo "Run:        ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:      ${{ github.event_name }}"
            echo "Git SHA:    ${{ github.sha }}"
            echo "Branch:     ${{ github.ref_name }}"
            echo "UTC:        $(date -u +%FT%TZ)"
            echo "ET:         $(TZ=America/New_York date '+%F %T %Z')"
            echo "Israel:     $(TZ=Asia/Jerusalem date '+%F %T %Z')"
            echo "Scan date:  $TODAY_ET"
            echo "=================================================="
          } | tee scan.log

      # ---------- 1. Checkout + Python ----------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- 2. מצא ריצה קודמת עם ארטיפקט ----------
      - name: Find previous run with valid artifact
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Looking for the most recent successful run with a valid artifact ..."

          WF_FILE=$(basename "${{ github.workflow_ref }}" | cut -d@ -f1)
          echo "workflow file: $WF_FILE"

          PREV=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WF_FILE}/runs?per_page=15" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"completed\") | .id" \
            | head -n 1 || true)

          if [ -z "$PREV" ]; then
            echo "No previous run — starting fresh."
            echo "artifact=" >> $GITHUB_OUTPUT
            exit 0
          fi

          ART=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$PREV/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("scan-")) | .name' \
            | head -n 1 || true)

          echo "run=$PREV"     >> $GITHUB_OUTPUT
          echo "artifact=$ART" >> $GITHUB_OUTPUT
          echo "Selected: run=$PREV artifact=$ART"

      - name: Download previous artifact
        if: steps.prev.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev

      - name: Restore DB and prior summaries
        if: steps.prev.outputs.artifact != ''
        run: |
          set -euo pipefail
          mkdir -p data summaries
          if [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
            echo "DB restored."
            ls -l data/alerts.db
          fi
          if [ -f /tmp/prev/summaries/all_runs.csv ]; then
            cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
            echo "Prior all_runs.csv restored ($(wc -l < summaries/all_runs.csv) lines)."
          else
            echo "No prior all_runs.csv — will create new."
          fi

      # ---------- 3. Pre-scan state ----------
      - name: Pre-scan DB state
        continue-on-error: true
        run: |
          python3 -c "
          import sqlite3, os
          p = os.environ.get('DB_PATH', 'data/alerts.db')
          if not os.path.exists(p):
              print('Pre-scan DB state: no DB yet')
          else:
              con = sqlite3.connect(p)
              cur = con.cursor()
              for t in ['snapshots','alerts','outcomes','trigger_results']:
                  try:
                      n = cur.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                      print(f'  {t}: {n}')
                  except Exception as e:
                      print(f'  {t}: ERR {e}')
              try:
                  rng = cur.execute('SELECT MIN(scan_date), MAX(scan_date) FROM snapshots').fetchone()
                  print(f'  scan_date range: {rng[0]} -> {rng[1]}')
              except Exception:
                  pass
              con.close()
          "

      # ---------- 4. Metadata + tests + migrations ----------
      - name: Write run metadata
        continue-on-error: true
        run: python3 scripts/write_run_metadata.py

      - name: Outcome engine tests
        run: python3 tests/test_outcome_engine.py

      - name: Migrations
        run: |
          python3 scripts/migrate_event_rank.py
          python3 scripts/migrate_research_meta.py
          python3 scripts/migrate_cost_columns.py

      # ---------- 5. Preflight (soft) ----------
      - name: Preflight check
        continue-on-error: true
        run: python3 scripts/preflight.py || true

      # ---------- 6. Scanner (append to scan.log) ----------
      - name: Run scanner
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scan.py 2>&1 | tee -a scan.log

      # ---------- 7. Build run summary ----------
      - name: Build run_summary.json
        if: always()
        env:
          RUN_ID:       ${{ github.run_id }}
          RUN_NUMBER:   ${{ github.run_number }}
          EVENT:        ${{ github.event_name }}
          SCAN_DATE:    ${{ env.TODAY_ET }}
          TIME_ET:      ${{ env.TODAY_ET }}
        run: |
          if [ -f scan.log ]; then
            python3 scripts/summarize_run.py scan.log run_summary.json || echo "{}" > run_summary.json
          else
            echo "{}" > run_summary.json
          fi
          echo "----- run_summary.json -----"
          cat run_summary.json || true

      # ---------- 8. Append to all_runs.csv ----------
      - name: Append to all_runs.csv
        if: always()
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true
          echo "----- all_runs.csv -----"
          cat summaries/all_runs.csv || true

      # ---------- 9. Diagnostics (soft) ----------
      - name: Research diagnostics
        if: always()
        continue-on-error: true
        run: python3 scripts/research_diagnostics.py || true

      - name: PM forensics
        if: always()
        continue-on-error: true
        run: python3 scripts/pm_forensics.py || true

      # ---------- 10. Upload ----------
      - name: Upload scan artifact (DB + summary + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            summaries/all_runs.csv
            scan.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload daily aggregate (rolling)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-runs-${{ env.TODAY_ET }}
          path: summaries/all_runs.csv
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
