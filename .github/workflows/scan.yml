name: DAYS-BOT

on:
  schedule:
    - cron: '30 12 * * 1-5'   # 08:30 ET (12:30 UTC) – סריקה וכניסה
    - cron: '0 3 * * 1-5'     # 23:00 ET (03:00 UTC) – עדכון תוצאות
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run Morning Scan
        if: github.event.schedule == '30 12 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python main.py full
      
      - name: Update Trade Monitor (after morning scan)
        if: github.event.schedule == '30 12 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python trade_monitor.py
      
      - name: Run Evening Update
        if: github.event.schedule == '0 3 * * 1-5'
        run: python update_trades.py
      
      - name: Upload Database
        uses: actions/upload-artifact@v4
        with:
          name: trades-db
          path: data/*.db
      
      - name: List data folder (debug)
        run: |
          pwd
          ls -la data/
          find . -name "*.db"
