name: DAYS-BOT V5.0.8 Swing Pipeline

on:
  schedule:
    - cron: '3 14 * * 1-5' 
    - cron: '37 21 * * 1-5'
    - cron: '7 22 * * 1-5'
    - cron: '33 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - evaluate
          - both
          - backtest

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::FutureWarning"

jobs:
  scan:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'scan' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: db-restored-latest
          path: data/

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 main.py swing_v1 --manual

      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90
      
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  evaluate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'evaluate' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: db-restored-latest
          path: data/

      - name: Run evaluator
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/evaluate_swing.py

      - name: Simulate Exit Models
        run: python3 scripts/simulate_exits.py

      - name: Analyze Features
        run: python3 scripts/analyze_features.py

      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  backtest:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backtest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Backtest
        run: python3 scripts/backtest_dip_filter.py