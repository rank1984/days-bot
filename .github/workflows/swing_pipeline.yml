name: DAYS-BOT V5.0.8 Swing Pipeline

on:
  schedule:
    # ⚠️ חשוב: הזמנים כאן הם UTC. כרגע הם מותאמים לחורף (EST).
    # אחרי מרץ 2027 (מעבר לשעון קיץ), צריך להוסיף שעה לכל ה-cron.
    
    # סריקה בוקרת (אחרי פתיחה) - 09:03 ET
    - cron: '3 14 * * 1-5' 
    # סריקה אחרי סגירה - 16:37 ET
    - cron: '37 21 * * 1-5'
    # ריצת גיבוי - 17:07 ET
    - cron: '7 22 * * 1-5'
    # הערכה (Evaluator) - 17:33 ET
    - cron: '33 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - evaluate
          - both
          - backtest

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::FutureWarning"

jobs:
  # =========================================================================
  # JOB 1: SCAN (סורק מניות)
  # =========================================================================
  scan:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'scan' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: db-restored-latest
          path: data/

      - name: Run scanner
        run: python3 main.py swing_v1 --manual

      # --- תיקון: שמירת ה-DB המעודכן לריצה הבאה ---
      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90
      
      # --- שמירת הארטיפקט של הריצה הנוכחית (לגיבוי) ---
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  # =========================================================================
  # JOB 2: EVALUATE (מעריך תוצאות + ניתוח)
  # =========================================================================
  evaluate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'evaluate' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: db-restored-latest
          path: data/

      - name: Run evaluator
        run: python3 scripts/evaluate_swing.py

      - name: Simulate Exit Models
        run: python3 scripts/simulate_exits.py

      - name: Analyze Features
        run: python3 scripts/analyze_features.py

      # --- תיקון: שמירת ה-DB המעודכן לריצה הבאה ---
      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90

      # --- שמירת הארטיפקט של הריצה הנוכחית (לגיבוי) ---
      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  # =========================================================================
  # JOB 3: BACKTEST (בדיקת הפילטר על שנה אחורה)
  # =========================================================================
  backtest:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backtest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Backtest
        run: python3 scripts/backtest_dip_filter.py