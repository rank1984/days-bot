name: DAYS-BOT V5.0.8 Swing Pipeline

on:
  schedule:
  - cron: '3 9 * * 1-5'
    timezone: "America/New_York"
  - cron: '37 16 * * 1-5'
    timezone: "America/New_York"
  - cron: '7 17 * * 1-5'
    timezone: "America/New_York"
  - cron: '33 17 * * 1-5'
    timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options:
          - scan
          - evaluate
          - both
          - diagnose
        default: both
      force:
        description: 'Skip dedup'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: days-bot-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::FutureWarning"

jobs:
  scan:
    if: >-
      ${{ (github.event_name == 'schedule' && github.event.schedule != '30 17 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
      && (github.event.inputs.mode == 'scan' || github.event.inputs.mode == 'both')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dedup check
        id: dedup
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status == \"completed\" and .conclusion == \"success\")] | .[0] | .updated_at" \
            2>/dev/null || echo "")
          if [ -z "$LAST_RUN" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_EPOCH=$(date -d "$LAST_RUN" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          DIFF_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
          if [ "$DIFF_MIN" -lt 120 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute time env
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV
          echo "IN_PM_WINDOW=0" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "IS_SCHEDULED=1" >> $GITHUB_ENV
          else
            echo "IS_SCHEDULED=0" >> $GITHUB_ENV
          fi

      - name: Banner
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.8 - SCAN"
            echo "Run:    ${{ github.run_id }} (#${{ github.run_number }})"
            echo "Event:  ${{ github.event_name }}"
            echo "UTC:    $(date -u +%FT%TZ)"
            echo "ET:     $(TZ=America/New_York date '+%F %T %Z')"
            echo "=================================================="
          } | tee scan.log

      - uses: actions/checkout@v4
        if: ${{ steps.dedup.outputs.skip != 'true' }}

      - uses: actions/setup-python@v5
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install sqlite3
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: sudo apt-get install -y sqlite3

      - name: Find latest DB artifact
        id: prev
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[prev] === SEARCHING ALL RUNS (including failed) ==="
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed") | .id' \
            2>/dev/null || echo "")
          echo "[prev] Total completed runs to scan: $(echo "$RUNS" | wc -w)"
          FOUND_RUN=""; FOUND_ART=""

          echo "[prev] Pass 1: searching for db-restored-* (highest priority)"
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("db-restored-")) | select(.size_in_bytes > 10000) | .name' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then
              FOUND_RUN="$RID"; FOUND_ART="$ART"
              echo "[prev]   HIT: $ART (run $RID)"
              break
            fi
          done

          if [ -z "$FOUND_RUN" ]; then
            echo "[prev] Pass 1 found nothing. Pass 2: fallback to scan-* / eval-* / db-*"
            for RID in $RUNS; do
              ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
                --jq '.artifacts[] | select(.name | test("^(scan|eval|db)-")) | select(.size_in_bytes > 10000) | .name' \
                2>/dev/null | head -n 1 || true)
              if [ -n "$ART" ]; then
                FOUND_RUN="$RID"; FOUND_ART="$ART"
                echo "[prev]   HIT: $ART (run $RID)"
                break
              fi
            done
          fi

          if [ -n "$FOUND_RUN" ]; then
            echo "run=$FOUND_RUN" >> $GITHUB_OUTPUT
            echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT
            echo "[prev] Selected: $FOUND_ART (run $FOUND_RUN)"
          else
            echo "[prev] No prior artifact found - will start fresh"
          fi

      - name: Download previous artifact
        if: ${{ steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB
        if: ${{ steps.dedup.outputs.skip != 'true' && steps.prev.outputs.artifact != '' }}
        run: |
          mkdir -p data summaries
          [ -f /tmp/prev/data/alerts.db ]         && cp /tmp/prev/data/alerts.db         data/alerts.db
          [ -f /tmp/prev/summaries/all_runs.csv ] && cp /tmp/prev/summaries/all_runs.csv summaries/all_runs.csv
          [ -f /tmp/prev/run_summary_prior.json ] && cp /tmp/prev/run_summary_prior.json run_summary_prior.json
          echo "DB restored."

      - name: Verify DB integrity
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          set +e
          [ ! -f data/alerts.db ] && exit 0
          R=$(sqlite3 data/alerts.db "PRAGMA integrity_check;" 2>&1 | head -1)
          if [ "$R" = "ok" ]; then
            echo "[integrity] ok"
          else
            echo "[integrity] WARN: $R - renaming"
            mv data/alerts.db data/alerts.db.corrupt
          fi

      - name: Pre-scan DB state
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          if [ ! -f data/alerts.db ]; then
            echo "no DB yet" | tee -a scan.log
          else
            {
              echo "=== Pre-scan DB state ==="
              sqlite3 -header -column data/alerts.db <<'SQL'
              SELECT 'snapshots' AS tbl, COUNT(*) AS cnt FROM snapshots
              UNION ALL SELECT 'outcomes', COUNT(*) FROM outcomes
              UNION ALL SELECT 'alerts', COUNT(*) FROM alerts;
          SQL
            } | tee -a scan.log
          fi

      - name: Capture PRE-scan snapshot count
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          PRE=$(sqlite3 data/alerts.db "SELECT COUNT(*) FROM snapshots;" 2>/dev/null || echo 0)
          echo "PRE_SCAN_COUNT=$PRE" >> $GITHUB_ENV
          echo "[pre] snapshots before scan: $PRE"

      - name: Outcome engine tests
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        continue-on-error: true
        run: python3 tests/test_outcome_engine.py 2>&1 | tee -a scan.log || true

      - name: Migrations
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          python3 scripts/migrate_event_rank.py    >> scan.log 2>&1 || true
          python3 scripts/migrate_research_meta.py >> scan.log 2>&1 || true
          python3 scripts/migrate_cost_columns.py  >> scan.log 2>&1 || true

      - name: Preflight (swing inline)
        id: preflight
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          set +e
          echo "=== preflight (swing inline) ===" | tee preflight.log
          if [ -f data/alerts.db ]; then
            INTEG=$(sqlite3 data/alerts.db "PRAGMA integrity_check;" 2>&1 | head -1)
            if [ "$INTEG" != "ok" ]; then
              echo "[preflight] DB corrupted: $INTEG" | tee -a preflight.log
              echo "PREFLIGHT_PASSED=0" >> $GITHUB_ENV
              exit 0
            fi
            echo "[preflight] DB integrity OK" | tee -a preflight.log
          fi
          echo "PREFLIGHT_PASSED=1" >> $GITHUB_ENV
          echo "PREFLIGHT PASSED" | tee -a preflight.log
          exit 0

      - name: Run scanner
        id: scan
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          RESEARCH_MODE:     "true"
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:   ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python3 main.py swing_v1 --manual 2>&1 | tee -a scan.log

      - name: Backfill preflight_passed
        if: ${{ steps.dedup.outputs.skip != 'true' && env.PREFLIGHT_PASSED == '1' }}
        run: |
          set +e
          [ ! -f data/alerts.db ] && exit 0
          BAD=$(sqlite3 data/alerts.db "SELECT COUNT(*) FROM snapshots WHERE scan_date='$TODAY_ET' AND preflight_passed=0;")
          if [ "$BAD" -gt 0 ]; then
            sqlite3 data/alerts.db "UPDATE snapshots SET preflight_passed=1 WHERE scan_date='$TODAY_ET' AND preflight_passed=0;"
            echo "[backfill] fixed $BAD snapshots"
          fi

      - name: Write run metadata
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        env:
          PREFLIGHT_PASSED: ${{ env.PREFLIGHT_PASSED }}
          SCAN_DATE:        ${{ env.TODAY_ET }}
          TIME_ET:          ${{ env.TIME_ET }}
          IS_SCHEDULED:     ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:     ${{ env.IN_PM_WINDOW }}
        run: python3 scripts/write_run_metadata.py 2>&1 | tee -a scan.log || true

      - name: Build run_summary.json
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        env:
          PRE_SCAN_COUNT:   ${{ env.PRE_SCAN_COUNT }}
          PREFLIGHT_PASSED: ${{ env.PREFLIGHT_PASSED }}
          SCAN_DATE:        ${{ env.TODAY_ET }}
          TIME_ET:          ${{ env.TIME_ET }}
          IS_SCHEDULED:     ${{ env.IS_SCHEDULED }}
          IN_PM_WINDOW:     ${{ env.IN_PM_WINDOW }}
        run: |
          python3 scripts/summarize_run.py scan.log run_summary.json \
            || echo '{"error":"summarize_failed"}' > run_summary.json

      - name: Append to all_runs.csv
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          mkdir -p summaries
          python3 scripts/append_run_summary.py run_summary.json summaries/all_runs.csv || true

      - name: Post-scan summary
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        run: |
          echo "=== POST-SCAN SUMMARY ===" | tee -a scan.log
          cat run_summary.json | tee -a scan.log
          {
            echo ""
            echo "=== DB state after scan ==="
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT 'snapshots_total' AS metric, COUNT(*) AS value FROM snapshots
            UNION ALL SELECT 'outcomes_total', COUNT(*) FROM outcomes
            UNION ALL SELECT 'today_snaps', COUNT(*) FROM snapshots WHERE scan_date = date('now');
          SQL
          } | tee -a scan.log

      - name: Upload scan artifact
        if: ${{ steps.dedup.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            run_summary.json
            run_summary_prior.json
            summaries/all_runs.csv
            scan.log
            preflight.log
          retention-days: 30
          if-no-files-found: warn

  evaluate:
    needs: [scan]
    if: >-
      ${{ always()
      && ((github.event_name == 'schedule' && github.event.schedule == '30 17 * * 1-5')
      || (github.event_name == 'workflow_dispatch'
      && (github.event.inputs.mode == 'evaluate' || github.event.inputs.mode == 'both'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install sqlite3
        run: sudo apt-get install -y sqlite3

      - name: Compute time env
        run: |
          echo "TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TIME_ET=$(TZ=America/New_York date +%H:%M)"     >> $GITHUB_ENV

      - name: Banner
        run: |
          {
            echo "=================================================="
            echo "DAYS-BOT V5.0.8 - EVALUATE"
            echo "Run:    ${{ github.run_id }} (#${{ github.run_number }})"
            echo "ET:     $(TZ=America/New_York date '+%F %T %Z')"
            echo "=================================================="
          } | tee eval.log

      - name: Download scan artifact (same workflow)
        id: same
        if: ${{ needs.scan.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scan-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: /tmp/prev

      - name: Find latest DB artifact
        id: prev
        if: ${{ steps.same.outcome != 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[prev] Searching all completed runs (including failed)"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed") | .id' \
            2>/dev/null || echo "")
          FOUND_RUN=""; FOUND_ART=""

          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("db-restored-")) | select(.size_in_bytes > 10000) | .name' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
          done

          if [ -z "$FOUND_RUN" ]; then
            for RID in $RUNS; do
              ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
                --jq '.artifacts[] | select(.name | test("^(scan|eval|db)-")) | select(.size_in_bytes > 10000) | .name' \
                2>/dev/null | head -n 1 || true)
              if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
            done
          fi

          if [ -n "$FOUND_RUN" ]; then
            echo "run=$FOUND_RUN" >> $GITHUB_OUTPUT
            echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT
            echo "[prev] Selected: $FOUND_ART (run $FOUND_RUN)"
          fi

      - name: Download previous artifact
        if: ${{ steps.same.outcome != 'success' && steps.prev.outputs.artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Restore DB
        run: |
          mkdir -p data
          if [ -f /tmp/prev/data/alerts.db ]; then
            cp /tmp/prev/data/alerts.db data/alerts.db
            echo "[eval] DB restored"
          else
            echo "::error::No DB available for evaluation"
            exit 1
          fi

      - name: Verify DB integrity
        run: |
          R=$(sqlite3 data/alerts.db "PRAGMA integrity_check;" 2>&1 | head -1)
          [ "$R" = "ok" ] || { echo "::error::DB corrupt: $R"; exit 1; }
          echo "[eval] DB integrity ok"

      - name: BEFORE evaluate
        run: |
          {
            echo "=== BEFORE evaluate ==="
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT 'snapshots_total' AS metric, COUNT(*) AS value FROM snapshots
            UNION ALL SELECT 'outcomes_total', COUNT(*) FROM outcomes
            UNION ALL SELECT 'swing_snaps', COUNT(*) FROM snapshots WHERE trade_type='SWING_1_3D';
          SQL
          } | tee -a eval.log

      - name: Check evaluator script
        run: |
          if [ ! -f scripts/evaluate_swing.py ]; then
            echo "::error::scripts/evaluate_swing.py not found"
            exit 1
          fi

      - name: Run evaluator
        id: eval
        continue-on-error: true
        env:
          RESEARCH_MODE: "true"
        run: |
          set -o pipefail
          python3 scripts/evaluate_swing.py 2>&1 | tee -a eval.log

      - name: AFTER evaluate
        if: ${{ always() }}
        run: |
          echo "=== AFTER evaluate ===" | tee -a eval.log
          {
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT 'outcomes_total' AS metric, COUNT(*) AS value FROM outcomes
            UNION ALL SELECT 'valid_outcomes', COUNT(*) FROM outcomes WHERE net_r_status='VALID'
            UNION ALL SELECT 'win_count', SUM(CASE WHEN net_r > 0 THEN 1 ELSE 0 END) FROM outcomes WHERE net_r_status='VALID'
            UNION ALL SELECT 'loss_count', SUM(CASE WHEN net_r <= 0 THEN 1 ELSE 0 END) FROM outcomes WHERE net_r_status='VALID';
          SQL
          } | tee -a eval.log
          echo "" | tee -a eval.log
          echo "--- win rate and avg Net R ---" | tee -a eval.log
          {
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT
              COUNT(*) AS n,
              ROUND(100.0 * SUM(CASE WHEN net_r > 0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS win_pct,
              ROUND(AVG(net_r), 4) AS avg_net_r,
              ROUND(MIN(net_r), 4) AS min_net_r,
              ROUND(MAX(net_r), 4) AS max_net_r
            FROM outcomes WHERE net_r_status='VALID';
          SQL
          } | tee -a eval.log

      - name: Upload eval artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ env.TODAY_ET }}-r${{ github.run_number }}
          path: |
            data/alerts.db
            eval.log
          retention-days: 30
          if-no-files-found: warn

  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3
        run: sudo apt-get install -y sqlite3

      - name: Find latest DB artifact
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="completed") | .id' \
            2>/dev/null || echo "")
          FOUND_RUN=""; FOUND_ART=""
          for RID in $RUNS; do
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("db-restored-")) | select(.size_in_bytes > 10000) | .name' \
              2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
          done
          if [ -z "$FOUND_RUN" ]; then
            for RID in $RUNS; do
              ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" \
                --jq '.artifacts[] | select(.name | test("^(scan|eval|db)-")) | select(.size_in_bytes > 10000) | .name' \
                2>/dev/null | head -n 1 || true)
              if [ -n "$ART" ]; then FOUND_RUN="$RID"; FOUND_ART="$ART"; break; fi
            done
          fi
          if [ -n "$FOUND_RUN" ]; then
            echo "run=$FOUND_RUN" >> $GITHUB_OUTPUT
            echo "artifact=$FOUND_ART" >> $GITHUB_OUTPUT
          fi

      - name: Download DB
        if: ${{ steps.prev.outputs.artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev.outputs.artifact }}
          path: /tmp/prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.prev.outputs.run }}
          repository: ${{ github.repository }}

      - name: Diagnostic report
        run: |
          if [ ! -f /tmp/prev/data/alerts.db ]; then
            echo "::error::No DB found"; exit 1
          fi
          mkdir -p data
          cp /tmp/prev/data/alerts.db data/alerts.db
          {
            echo "=== DIAGNOSTIC ==="
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT 'snapshots_total' AS metric, COUNT(*) AS value FROM snapshots
            UNION ALL SELECT 'outcomes_total', COUNT(*) FROM outcomes
            UNION ALL SELECT 'swing_snaps', COUNT(*) FROM snapshots WHERE trade_type='SWING_1_3D'
            UNION ALL SELECT 'pf1_snaps', COUNT(*) FROM snapshots WHERE preflight_passed=1;
          SQL
          }
          {
            echo ""
            echo "=== Per scan_date ==="
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT scan_date, COUNT(*) AS snaps,
              SUM(CASE WHEN snapshot_id IN (SELECT snapshot_id FROM outcomes) THEN 1 ELSE 0 END) AS evaluated
            FROM snapshots
            GROUP BY scan_date
            ORDER BY scan_date DESC
            LIMIT 20;
          SQL
          }
          {
            echo ""
            echo "=== Outcomes stats ==="
            sqlite3 -header -column data/alerts.db <<'SQL'
            SELECT COUNT(*) AS n,
              ROUND(100.0 * SUM(CASE WHEN net_r > 0 THEN 1 ELSE 0 END) / MAX(COUNT(*),1), 2) AS win_pct,
              ROUND(AVG(net_r), 4) AS avg_net_r
            FROM outcomes WHERE net_r_status='VALID';
          SQL
          }
