name: DAYS-BOT V5.0.9 Swing Pipeline

on:
  schedule:
    # Macro (בוקר) - 09:37 ET (14:37 UTC בחורף)
    - cron: '37 14 * * 1-5' 
    # Scan (אחרי סגירה) - 16:37 ET (21:37 UTC בחורף)
    - cron: '37 21 * * 1-5'
    # Evaluate - 17:33 ET (22:33 UTC בחורף)
    - cron: '33 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - evaluate
          - both
          - backtest
          - macro

permissions:
  actions: read
  contents: read

concurrency:
  group: days-bot-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  DB_PATH: data/alerts.db
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::FutureWarning"

jobs:
  # =========================================================================
  # JOB 0: MACRO (בוקר בלבד)
  # =========================================================================
  macro:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '37 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'macro')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo
            });
            const filtered = artifacts.data.artifacts
              .filter(a => a.name === 'db-restored-latest' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = filtered[0];
            if (!latest) { console.log('No previous DB artifact found.'); return; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: latest.id, archive_format: 'zip'
            });
            require('fs').writeFileSync('db.zip', Buffer.from(dl.data));
            require('child_process').execSync('unzip -o db.zip -d data/');

      - name: Check Macro
        run: python3 scripts/check_macro.py

      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90

  # =========================================================================
  # JOB 1: SCAN (אחרי סגירה - כולל רענון מאקרו)
  # =========================================================================
  scan:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '37 21 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'scan' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo
            });
            const filtered = artifacts.data.artifacts
              .filter(a => a.name === 'db-restored-latest' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = filtered[0];
            if (!latest) { console.log('No previous DB artifact found.'); return; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: latest.id, archive_format: 'zip'
            });
            require('fs').writeFileSync('db.zip', Buffer.from(dl.data));
            require('child_process').execSync('unzip -o db.zip -d data/');

      # --- תיקון: רענון מאקרו לפני הסריקה ---
      - name: Refresh Macro
        run: python3 scripts/check_macro.py

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 main.py swing_v1 --manual

      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90
      
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  # =========================================================================
  # JOB 2: EVALUATE (לילה)
  # =========================================================================
  evaluate:
    runs-on: ubuntu-latest
    if: |
      always() && 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'evaluate' || github.event.inputs.mode == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '33 22 * * 1-5') ||
      (needs.scan.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo
            });
            const filtered = artifacts.data.artifacts
              .filter(a => a.name === 'db-restored-latest' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = filtered[0];
            if (!latest) { console.log('No previous DB artifact found.'); return; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: latest.id, archive_format: 'zip'
            });
            require('fs').writeFileSync('db.zip', Buffer.from(dl.data));
            require('child_process').execSync('unzip -o db.zip -d data/');

      - name: Run evaluator
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/evaluate_swing.py

      - name: Simulate Exit Models
        run: python3 scripts/simulate_exits.py

      - name: Analyze Features
        run: python3 scripts/analyze_features.py

      - name: Upload DB for next run
        uses: actions/upload-artifact@v4
        with:
          name: db-restored-latest
          path: data/alerts.db
          overwrite: true
          retention-days: 90

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: data/alerts.db
          retention-days: 30

  # =========================================================================
  # JOB 3: BACKTEST
  # =========================================================================
  backtest:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backtest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Backtest
        run: python3 scripts/backtest_dip_filter.py